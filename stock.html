<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AUR 证券</title>
<!-- 优先使用 cdnjs / jsdelivr 双兜底 CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.39.8/supabase.umd.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js'"></script>
<style>
  :root{
    --bg:#0a0e17;
    --card:#131722;
    --card2:#171c2b;
    --text:#e4e8f1;
    --sub:#8b92a5;
    --up:#22c55e;
    --down:#ef4444;
    --gold:#f5c518;
    --border:#232838;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    overscroll-behavior-y:none;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;background:rgba(10,14,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:.3px;}
  .brand .bolt{color:var(--gold);font-size:19px;}
  .balance{font-size:13px;color:var(--sub);text-align:right;}
  .balance b{display:block;color:var(--gold);font-size:16px;font-weight:700;}

  .page{flex:1;padding:12px 12px 90px;display:none;}
  .page.active{display:block;}

  .section-title{font-size:13px;color:var(--sub);margin:16px 4px 8px;font-weight:600;letter-spacing:.5px;}
  .section-title:first-child{margin-top:4px;}

  .stock-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);
    border-radius:14px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--border);transition:background .15s;}
  .stock-row:active{background:var(--card2);}
  .sr-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .sr-symbol{font-weight:700;font-size:15px;}
  .sr-name{font-size:12px;color:var(--sub);}
  .sr-mid{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:1;padding-right:10px;}
  .sr-price{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;}
  .sr-chg{font-size:12px;font-variant-numeric:tabular-nums;}
  .sr-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:52px;}
  .sr-hold-label{font-size:10px;color:var(--sub);}
  .sr-hold-val{font-size:13px;font-weight:600;}
  .up{color:var(--up);}
  .down{color:var(--down);}
  .flat{color:var(--sub);}

  @keyframes flashUp{0%{background:rgba(34,197,94,.28);}100%{background:var(--card);}}
  @keyframes flashDown{0%{background:rgba(239,68,68,.28);}100%{background:var(--card);}}
  .flash-up{animation:flashUp .6s ease-out;}
  .flash-down{animation:flashDown .6s ease-out;}

  .hold-card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--border);}
  .hc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .hc-name{font-weight:700;font-size:15px;}
  .hc-name span{color:var(--sub);font-weight:400;font-size:12px;margin-left:6px;}
  .hc-pnl{font-weight:700;font-size:15px;}
  .hc-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12px;color:var(--sub);}
  .hc-grid b{color:var(--text);font-weight:600;}
  .empty-state{text-align:center;color:var(--sub);padding:60px 20px;font-size:13px;line-height:1.7;}

  .me-card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:12px;border:1px solid var(--border);}
  .me-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .me-row:last-child{border-bottom:none;}
  .me-row span:first-child{color:var(--sub);}
  .me-row b{font-variant-numeric:tabular-nums;word-break:break-all;text-align:right;max-width:65%;}
  .btn-action{width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);background:var(--card);
    color:var(--text);font-weight:600;font-size:14px;margin-top:8px;cursor:pointer;}
  .btn-logout{color:var(--down);}

  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
    display:flex;background:rgba(19,23,34,.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);
    padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:25;}
  .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sub);
    font-size:11px;padding:4px 0;font-weight:600;cursor:pointer;}
  .tab-item.active{color:var(--gold);}
  .tab-icon{font-size:19px;line-height:1;}

  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;}
  .sheet-backdrop.show{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:520px;
    background:var(--card);border-radius:20px 20px 0 0;z-index:41;padding:16px 18px max(18px,env(safe-area-inset-bottom));
    transition:transform .25s cubic-bezier(.32,.72,0,1);max-height:88vh;overflow-y:auto;}
  .sheet.show{transform:translate(-50%,0);}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 14px;}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
  .sh-title{font-size:18px;font-weight:700;}
  .sh-title span{color:var(--sub);font-weight:400;font-size:13px;margin-left:6px;}
  .sh-price{text-align:right;}
  .sh-price b{font-size:18px;font-variant-numeric:tabular-nums;}
  .sh-price div{font-size:12px;}

  .seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:14px;}
  .seg-btn{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-weight:700;font-size:14px;color:var(--sub);cursor:pointer;}
  .seg-btn.active-buy{background:var(--up);color:#08170d;}
  .seg-btn.active-sell{background:var(--down);color:#1a0505;}

  .qty-wrap{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .qty-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:var(--text);
    font-size:18px;font-weight:700;padding:11px 14px;text-align:center;font-variant-numeric:tabular-nums;}
  .qty-input:focus{outline:none;border-color:var(--gold);}
  .qty-quick{display:flex;gap:6px;margin-bottom:14px;}
  .qty-quick button{flex:1;padding:8px 0;border-radius:9px;border:1px solid var(--border);background:var(--bg);
    color:var(--text);font-size:12px;font-weight:600;cursor:pointer;}
  .qty-quick button:active{background:var(--card2);}

  .est-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg);
    border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:13px;color:var(--sub);}
  .est-row b{color:var(--text);font-size:15px;font-variant-numeric:tabular-nums;}
  .hold-hint{font-size:12px;color:var(--sub);margin-bottom:14px;padding-left:2px;}

  .confirm-btn{width:100%;padding:15px;border-radius:14px;border:none;font-weight:700;font-size:16px;color:#fff;cursor:pointer;}
  .confirm-btn.buy{background:var(--up);color:#08170d;}
  .confirm-btn.sell{background:var(--down);color:#1a0505;}
  .confirm-btn:disabled{opacity:.4;cursor:not-allowed;}

  .recent-title{font-size:12px;color:var(--sub);margin:16px 0 8px;font-weight:600;}
  .recent-row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;color:var(--sub);
    border-bottom:1px solid var(--border);}
  .recent-row .rside-buy{color:var(--up);}
  .recent-row .rside-sell{color:var(--down);}

  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-60px);z-index:80;
    padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;color:#fff;opacity:0;
    transition:all .25s ease;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
  .toast.ok{background:var(--up);color:#08170d;}
  .toast.err{background:var(--down);color:#fff;}

  .dbg-fab{position:fixed;right:14px;bottom:78px;z-index:60;width:40px;height:40px;border-radius:50%;
    background:var(--card2);border:1px solid var(--border);color:var(--sub);font-size:16px;
    display:flex;align-items:center;justify-content:center;opacity:.7;cursor:pointer;}
  .dbg-panel{position:fixed;right:10px;left:10px;bottom:126px;max-height:42vh;z-index:59;
    background:rgba(10,14,23,.96);border:1px solid var(--border);border-radius:14px;padding:10px;
    overflow-y:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;display:none;}
  .dbg-panel.show{display:block;}
  .dbg-line{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);word-break:break-all;}
  .dbg-t{color:var(--sub);margin-right:6px;}
  .dbg-g{color:var(--up);}
  .dbg-y{color:var(--gold);}
  .dbg-r{color:var(--down);}

  .loading-msg{text-align:center;color:var(--sub);padding:50px 20px;font-size:13px;}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand"><span class="bolt">⚡</span> AUR 证券</div>
    <div class="balance">余额<b id="balanceVal">-- AUR</b></div>
  </div>

  <div class="page active" id="page-market">
    <div id="marketList"><div class="loading-msg">加载行情中…</div></div>
  </div>

  <div class="page" id="page-holdings">
    <div id="holdingsList"><div class="loading-msg">加载持仓中…</div></div>
  </div>

  <div class="page" id="page-me">
    <div class="me-card">
      <div class="me-row"><span>身份标识</span><b id="meUid">--</b></div>
      <div class="me-row"><span>现金余额</span><b id="meCash">--</b></div>
      <div class="me-row"><span>持仓市值</span><b id="meMarketVal">--</b></div>
      <div class="me-row"><span>总资产估值</span><b id="meTotal">--</b></div>
    </div>
    <button class="btn-action btn-logout" id="btnLogout">退出登录</button>
  </div>

  <div class="tabbar">
    <div class="tab-item active" data-tab="market"><div class="tab-icon">📈</div>行情</div>
    <div class="tab-item" data-tab="holdings"><div class="tab-icon">💼</div>持仓</div>
    <div class="tab-item" data-tab="me"><div class="tab-icon">👤</div>我的</div>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="tradeSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div>
        <div class="sh-title" id="shTitle">-- <span id="shName"></span></div>
      </div>
      <div class="sh-price">
        <b id="shPrice">--</b>
        <div id="shChg">--</div>
      </div>
    </div>

    <div class="seg">
      <div class="seg-btn active-buy" id="segBuy">买入</div>
      <div class="seg-btn" id="segSell">卖出</div>
    </div>

    <div class="qty-wrap">
      <input type="number" class="qty-input" id="qtyInput" value="10" min="1" step="1">
    </div>
    <div class="qty-quick">
      <button data-q="10">10</button>
      <button data-q="50">50</button>
      <button data-q="100">100</button>
      <button data-q="500">500</button>
    </div>

    <div class="est-row">
      <span id="estLabel">预估花费</span>
      <b id="estVal">0.00 AUR</b>
    </div>
    <div class="hold-hint" id="holdHint"></div>

    <button class="confirm-btn buy" id="confirmBtn">确认买入</button>

    <div class="recent-title">最近成交</div>
    <div id="recentTrades"></div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="dbg-fab" id="dbgFab">🐞</div>
  <div class="dbg-panel" id="dbgPanel">
    <button id="dbgCopyBtn" style="width:100%;padding:8px;margin-bottom:8px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:11px;font-weight:600;cursor:pointer;">复制日志</button>
    <div id="dbgLines"></div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ------------------------------------------------------------------
  // 配置
  // ------------------------------------------------------------------
  const SUPABASE_URL = "https://irnaphrjcdfmqyykdron.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlybmFwaHJqY2RmbXF5eWtkcm9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDUzNzIsImV4cCI6MjEwMzI4MTM3Mn0.4FNlvN4GfVSmYQTr2ZelAc96EavUohqbLURirbeIUlI";
  const TICK_MS = 15000;

  const TIER_LABEL = { low: "低档位 · 练手股", mid: "中档位 · 龙头股", high: "高档位 · 世界巨头" };
  const TIER_ORDER = ["low","mid","high"];

  // ------------------------------------------------------------------
  // 调试面板
  // ------------------------------------------------------------------
  const dbgPanel = document.getElementById("dbgPanel");
  const dbgLines = document.getElementById("dbgLines");
  const dbgFab = document.getElementById("dbgFab");
  const dbgCopyBtn = document.getElementById("dbgCopyBtn");
  const dbgHistory = [];
  
  function dbg(msg, level){
    level = level || "g";
    const t = new Date().toLocaleTimeString("zh-CN", {hour12:false});
    dbgHistory.push("[" + t + "] " + String(msg));
    const line = document.createElement("div");
    line.className = "dbg-line";
    line.innerHTML = '<span class="dbg-t">' + t + '</span><span class="dbg-' + level + '">' + escapeHtml(String(msg)) + '</span>';
    dbgLines.appendChild(line);
    dbgPanel.scrollTop = dbgPanel.scrollHeight;
    while (dbgLines.children.length > 200) dbgLines.removeChild(dbgLines.firstChild);
  }
  
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  
  dbgFab.addEventListener("click", () => dbgPanel.classList.toggle("show"));
  dbgCopyBtn.addEventListener("click", async () => {
    const text = dbgHistory.join("\n");
    try{
      await navigator.clipboard.writeText(text);
      dbgCopyBtn.textContent = "已复制 ✓";
      setTimeout(() => { dbgCopyBtn.textContent = "复制日志"; }, 1500);
    } catch(e){
      dbgCopyBtn.textContent = "复制失败，请截图调试面板";
      setTimeout(() => { dbgCopyBtn.textContent = "复制日志"; }, 2000);
    }
  });

  window.addEventListener("error", (e) => {
    dbg("捕获异常: " + (e && e.message ? e.message : e), "r");
  });

  function showBannerWarning(text, showAuthLink){
    const box = document.getElementById("marketList");
    let html = '<div class="empty-state"><div style="color:var(--gold);font-size:15px;font-weight:bold;margin-bottom:8px;">⚠️ 提示</div>' + escapeHtml(text);
    if (showAuthLink) {
      html += '<br><br><button onclick="location.reload()" class="btn-action" style="max-width:200px;margin:0 auto;display:block;">重新加载页面</button>';
    }
    html += '</div>';
    if (box) box.innerHTML = html;
  }

  // ------------------------------------------------------------------
  // Supabase SDK 验证
  // ------------------------------------------------------------------
  function waitForSupabaseLib(timeoutMs){
    return new Promise((resolve, reject) => {
      const start = Date.now();
      const timer = setInterval(() => {
        if (window.supabase && typeof window.supabase.createClient === "function"){
          clearInterval(timer);
          resolve();
        } else if (Date.now() - start > timeoutMs){
          clearInterval(timer);
          reject(new Error("Supabase 客户端 SDK 网络加载超时"));
        }
      }, 100);
    });
  }

  // ------------------------------------------------------------------
  // Toast 提示
  // ------------------------------------------------------------------
  const toastEl = document.getElementById("toast");
  let toastTimer = null;
  function toast(msg, ok){
    toastEl.textContent = msg;
    toastEl.className = "toast show " + (ok ? "ok" : "err");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.classList.remove("show"); }, 2800);
  }

  // ------------------------------------------------------------------
  // 全局状态
  // ------------------------------------------------------------------
  let sb = null;
  let myAddress = null;
  let stocksMap = {};
  let holdingsMap = {};
  let balance = 0;
  let activeSymbol = null;
  let sheetSide = "buy";

  function fmt2(n){ return Number(n || 0).toFixed(2); }
  function chgClass(v){ v = Number(v); return v > 0 ? "up" : (v < 0 ? "down" : "flat"); }
  function chgSign(v){ v = Number(v); return (v > 0 ? "+" : "") + fmt2(v); }

  // ------------------------------------------------------------------
  // 数据获取
  // ------------------------------------------------------------------
  async function loadBalance(){
    if (!myAddress || !sb) return;
    try{
      const { data, error } = await sb.from("wallets").select("balance").eq("address", myAddress).maybeSingle();
      if (error) { dbg("查询余额错误: " + error.message, "r"); return; }
      balance = Number(data && data.balance) || 0;
      document.getElementById("balanceVal").textContent = fmt2(balance) + " AUR";
      dbg("余额更新: " + fmt2(balance) + " AUR");
    } catch(e){ dbg("加载余额异常: " + e.message, "r"); }
  }

  async function loadStocks(){
    if (!sb) return;
    try{
      const { data, error } = await sb.from("stocks").select("*").order("tier").order("symbol");
      if (error) { dbg("查询股票列表错误: " + error.message, "r"); toast("获取行情失败", false); return; }
      stocksMap = {};
      (data || []).forEach(s => { stocksMap[s.symbol] = s; });
      dbg("行情列表就绪: " + Object.keys(stocksMap).length + "只");
      renderMarket();
    } catch(e){ dbg("加载行情异常: " + e.message, "r"); }
  }

  async function loadHoldings(){
    if (!myAddress || !sb) return;
    try{
      const { data, error } = await sb.from("holdings").select("*").eq("address", myAddress);
      if (error) { dbg("查询持仓错误: " + error.message, "r"); return; }
      holdingsMap = {};
      (data || []).forEach(h => { holdingsMap[h.symbol] = h; });
      dbg("持仓加载就绪: " + Object.keys(holdingsMap).length + "项");
      renderMarket();
      renderHoldings();
      renderMe();
    } catch(e){ dbg("加载持仓异常: " + e.message, "r"); }
  }

  // ------------------------------------------------------------------
  // 视图渲染
  // ------------------------------------------------------------------
  function renderMarket(){
    const wrap = document.getElementById("marketList");
    if (!Object.keys(stocksMap).length){
      wrap.innerHTML = '<div class="loading-msg">加载行情数据中…</div>';
      return;
    }
    let html = "";
    TIER_ORDER.forEach(tier => {
      const list = Object.values(stocksMap).filter(s => s.tier === tier).sort((a,b)=>a.symbol.localeCompare(b.symbol));
      if (!list.length) return;
      html += '<div class="section-title">' + TIER_LABEL[tier] + '</div>';
      list.forEach(s => {
        const h = holdingsMap[s.symbol];
        const qty = h ? h.qty : 0;
        html += '<div class="stock-row" data-symbol="' + s.symbol + '" id="row-' + s.symbol + '">' +
          '<div class="sr-left"><div class="sr-symbol">' + s.symbol + '</div><div class="sr-name">' + s.name + '</div></div>' +
          '<div class="sr-mid"><div class="sr-price">' + fmt2(s.price) + '</div>' +
          '<div class="sr-chg ' + chgClass(s.change_pct) + '">' + chgSign(s.change_pct) + '%</div></div>' +
          '<div class="sr-right"><div class="sr-hold-label">持仓</div><div class="sr-hold-val">' + (qty > 0 ? qty : "-") + '</div></div>' +
          '</div>';
      });
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll(".stock-row").forEach(row => {
      row.addEventListener("click", () => openSheet(row.getAttribute("data-symbol"), "buy"));
    });
  }

  function renderHoldings(){
    const wrap = document.getElementById("holdingsList");
    const list = Object.values(holdingsMap).filter(h => h.qty > 0);
    if (!list.length){
      wrap.innerHTML = '<div class="empty-state">暂无持仓<br>去「行情」页买入你的第一只股票吧</div>';
      return;
    }
    let html = "";
    list.forEach(h => {
      const s = stocksMap[h.symbol];
      if (!s) return;
      const marketVal = s.price * h.qty;
      const costVal = h.avg_cost * h.qty;
      const pnl = marketVal - costVal;
      const pnlPct = costVal > 0 ? (pnl / costVal * 100) : 0;
      html += '<div class="hold-card" data-symbol="' + h.symbol + '">' +
        '<div class="hc-top"><div class="hc-name">' + h.symbol + '<span>' + s.name + '</span></div>' +
        '<div class="hc-pnl ' + chgClass(pnl) + '">' + chgSign(pnl) + '</div></div>' +
        '<div class="hc-grid">' +
        '<div>持仓股数 <b>' + h.qty + '</b></div>' +
        '<div>现价 <b>' + fmt2(s.price) + '</b></div>' +
        '<div>成本价 <b>' + fmt2(h.avg_cost) + '</b></div>' +
        '<div>市值 <b>' + fmt2(marketVal) + '</b></div>' +
        '<div>盈亏% <b class="' + chgClass(pnlPct) + '">' + chgSign(pnlPct) + '%</b></div>' +
        '</div></div>';
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll(".hold-card").forEach(card => {
      card.addEventListener("click", () => openSheet(card.getAttribute("data-symbol"), "sell"));
    });
  }

  function renderMe(){
    document.getElementById("meUid").textContent = myAddress || "未登录";
    document.getElementById("meCash").textContent = fmt2(balance) + " AUR";
    let marketVal = 0;
    Object.values(holdingsMap).forEach(h => {
      const s = stocksMap[h.symbol];
      if (s) marketVal += s.price * h.qty;
    });
    document.getElementById("meMarketVal").textContent = fmt2(marketVal) + " AUR";
    document.getElementById("meTotal").textContent = fmt2(marketVal + balance) + " AUR";
  }

  // Tab 切换
  document.querySelectorAll(".tab-item").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab-item").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById("page-" + tab.getAttribute("data-tab")).classList.add("active");
    });
  });

  // ------------------------------------------------------------------
  // 交易 Sheet
  // ------------------------------------------------------------------
  const sheetBackdrop = document.getElementById("sheetBackdrop");
  const tradeSheet = document.getElementById("tradeSheet");
  const qtyInput = document.getElementById("qtyInput");

  function openSheet(symbol, side){
    if (!myAddress) {
      toast("请先在云端矿场完成登录", false);
      return;
    }
    activeSymbol = symbol;
    sheetSide = side;
    const s = stocksMap[symbol];
    if (!s) return;
    document.getElementById("shTitle").innerHTML = symbol + ' <span id="shName">' + s.name + '</span>';
    updateSheetPrice();
    qtyInput.value = 10;
    setSide(side);
    renderRecentTrades(symbol);
    sheetBackdrop.classList.add("show");
    tradeSheet.classList.add("show");
  }

  function closeSheet(){
    sheetBackdrop.classList.remove("show");
    tradeSheet.classList.remove("show");
    activeSymbol = null;
  }
  sheetBackdrop.addEventListener("click", closeSheet);

  function updateSheetPrice(){
    if (!activeSymbol) return;
    const s = stocksMap[activeSymbol];
    if (!s) return;
    document.getElementById("shPrice").textContent = fmt2(s.price);
    const chgEl = document.getElementById("shChg");
    chgEl.textContent = chgSign(s.change_pct) + "%";
    chgEl.className = chgClass(s.change_pct);
    updateEstimate();
  }

  function setSide(side){
    sheetSide = side;
    const segBuy = document.getElementById("segBuy");
    const segSell = document.getElementById("segSell");
    const confirmBtn = document.getElementById("confirmBtn");
    const h = holdingsMap[activeSymbol];
    const heldQty = h ? h.qty : 0;

    if (side === "buy"){
      segBuy.classList.add("active-buy"); segSell.classList.remove("active-sell");
      document.getElementById("estLabel").textContent = "预估花费";
      confirmBtn.textContent = "确认买入";
      confirmBtn.className = "confirm-btn buy";
      confirmBtn.disabled = false;
      document.getElementById("holdHint").textContent = "余额 " + fmt2(balance) + " AUR";
    } else {
      segSell.classList.add("active-sell"); segBuy.classList.remove("active-buy");
      document.getElementById("estLabel").textContent = "预估获得";
      confirmBtn.textContent = "确认卖出";
      confirmBtn.className = "confirm-btn sell";
      confirmBtn.disabled = heldQty <= 0;
      document.getElementById("holdHint").textContent = heldQty > 0 ? ("可卖持仓 " + heldQty + " 股") : "当前无持仓，无法卖出";
    }
    updateEstimate();
  }

  document.getElementById("segBuy").addEventListener("click", () => setSide("buy"));
  document.getElementById("segSell").addEventListener("click", () => setSide("sell"));

  document.querySelectorAll(".qty-quick button").forEach(btn => {
    btn.addEventListener("click", () => {
      qtyInput.value = btn.getAttribute("data-q");
      updateEstimate();
    });
  });
  qtyInput.addEventListener("input", updateEstimate);

  function updateEstimate(){
    if (!activeSymbol) return;
    const s = stocksMap[activeSymbol];
    if (!s) return;
    const qty = Math.max(0, parseInt(qtyInput.value, 10) || 0);
    const est = qty * Number(s.price);
    document.getElementById("estVal").textContent = fmt2(est) + " AUR";
  }

  function renderRecentTrades(symbol){
    const wrap = document.getElementById("recentTrades");
    wrap.innerHTML = '<div style="color:var(--sub);font-size:12px;">加载中…</div>';
    sb.from("stock_trades").select("*").eq("symbol", symbol).order("created_at", {ascending:false}).limit(8)
      .then(({data, error}) => {
        if (error) { wrap.innerHTML = '<div style="color:var(--sub);font-size:12px;">加载失败</div>'; return; }
        if (!data || !data.length){ wrap.innerHTML = '<div style="color:var(--sub);font-size:12px;">暂无成交记录</div>'; return; }
        let html = "";
        data.forEach(t => {
          const time = new Date(t.created_at).toLocaleTimeString("zh-CN", {hour12:false});
          html += '<div class="recent-row"><span class="' + (t.side === "buy" ? "rside-buy" : "rside-sell") + '">' +
            (t.side === "buy" ? "买入" : "卖出") + ' ' + t.qty + ' 股 @ ' + fmt2(t.price) + '</span><span>' + time + '</span></div>';
        });
        wrap.innerHTML = html;
      });
  }

  document.getElementById("confirmBtn").addEventListener("click", async () => {
    if (!activeSymbol || !myAddress) return;
    const qty = parseInt(qtyInput.value, 10);
    if (!qty || qty <= 0) { toast("请输入有效数量", false); return; }

    const btn = document.getElementById("confirmBtn");
    btn.disabled = true;
    const fn = sheetSide === "buy" ? "buy_stock" : "sell_stock";

    try{
      const { data, error } = await sb.rpc(fn, { p_address: myAddress, p_symbol: activeSymbol, p_qty: qty });
      if (error){
        dbg("RPC 交易执行失败: " + error.message, "r");
        toast("交易失败: " + error.message, false);
        btn.disabled = false;
        return;
      }
      if (data && data.ok === false){
        toast(data.error || "操作失败", false);
        btn.disabled = false;
        return;
      }
      toast(sheetSide === "buy" ? ("买入成功，花费 " + fmt2(data.cost) + " AUR") : ("卖出成功，获得 " + fmt2(data.value) + " AUR"), true);
      closeSheet();
      await Promise.all([loadBalance(), loadHoldings()]);
    } catch(e){
      toast("交易异常: " + e.message, false);
      btn.disabled = false;
    }
  });

  // ------------------------------------------------------------------
  // WebSocket 实时订阅 & 定时刷新
  // ------------------------------------------------------------------
  function subscribeStocks(){
    if (!sb) return;
    sb.channel("stocks-rt")
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "stocks" }, (payload) => {
        const row = payload.new;
        if (!row || !row.symbol) return;
        const prevPrice = stocksMap[row.symbol] ? Number(stocksMap[row.symbol].price) : Number(row.price);
        stocksMap[row.symbol] = row;
        renderMarket();
        renderHoldings();
        renderMe();

        const rowEl = document.getElementById("row-" + row.symbol);
        if (rowEl){
          rowEl.classList.remove("flash-up","flash-down");
          void rowEl.offsetWidth;
          rowEl.classList.add(Number(row.price) >= prevPrice ? "flash-up" : "flash-down");
        }
        if (activeSymbol === row.symbol){
          updateSheetPrice();
        }
      })
      .subscribe((status) => {
        dbg("实时数据订阅: " + status, status === "SUBSCRIBED" ? "g" : "y");
      });
  }

  function startTickLoop(){
    setInterval(async () => {
      if (!sb) return;
      try{
        await sb.rpc("tick_stocks");
      } catch(e){ }
    }, TICK_MS);
  }

  document.getElementById("btnLogout").addEventListener("click", () => {
    localStorage.removeItem("aur_me");
    location.reload();
  });

  // ------------------------------------------------------------------
  // 应用初始化
  // ------------------------------------------------------------------
  async function bootstrap(){
    dbg("正在初始化应用组件…");
    try{
      await waitForSupabaseLib(8000);
    } catch(e){
      dbg(e.message, "r");
      showBannerWarning("Supabase SDK 依赖库加载失败，请检查网络连接后刷新重试。", true);
      return;
    }

    try{
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      dbg("Supabase SDK 连接就绪");
    } catch(e){
      dbg("初始化 Supabase 实例异常: " + e.message, "r");
      showBannerWarning("数据库连接配置异常：" + e.message, true);
      return;
    }

    // 检查缓存身份
    let me = null;
    try { me = JSON.parse(localStorage.getItem("aur_me")); } catch(e) { me = null; }

    if (!me) {
      dbg("未找到本地 aur_me 登录数据", "y");
      showBannerWarning("未检测到登录账户。请先打开「云端矿场」模块进行注册或登录，完成后再返回本模块。", false);
      await loadStocks(); // 允许未登录状态下预览股市行情
      subscribeStocks();
      return;
    }

    const myKey = me.address || me.addr || me.wallet || me.walletAddress ||
                  (me.uid !== undefined && me.uid !== null ? String(me.uid) : null);

    if (!myKey) {
      dbg("aur_me 中缺乏有效 address 识别字段", "r");
      showBannerWarning("身份数据异常，缺失 0x 钱包地址，请尝试重新登录云端矿场。", true);
      return;
    }

    myAddress = String(myKey);
    dbg("校验通过，当前用户 Address=" + myAddress);

    try{
      await loadStocks();
      await loadBalance();
      await loadHoldings();
      subscribeStocks();
      startTickLoop();
      dbg("应用初始化完成");
    } catch(e){
      dbg("加载过程异常: " + e.message, "r");
    }
  }

  bootstrap();

})();
</script>
</body>
</html>
