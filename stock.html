<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<title>AUR 证券交易所</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/js-sha256@0.9.0/build/sha256.min.js"></script>
<style>
:root{--bg:#0a0e17;--card:#131722;--text:#e4e8f1;--sub:#8b92a5;--border:#1e2330;--up:#22c55e;--down:#ef4444;--gold:#f5c518;--blue:#2a90ff;--nav:#0d2b52;--line:#1e2330}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button,input{font-family:inherit}
.brandbar{position:sticky;top:0;z-index:50;background:var(--nav);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.brandbar .logo{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:16px}
.brandbar .logo svg{flex:0 0 auto}
.brandbar .brand-sub{font-size:10px;opacity:.7;font-weight:500}
.balance-btn{background:rgba(255,255,255,.12);border:none;color:#fff;padding:6px 12px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px}
.help-btn{height:34px;padding:0 14px;border-radius:17px;border:none;cursor:pointer;background:rgba(245,197,24,.16);color:var(--gold);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;margin-left:10px}
.bottomtab{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--border);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(0,0,0,.2)}
.bottomtab a{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--sub);font-size:11px;font-weight:600;padding:5px 2px;border-radius:10px}
.bottomtab a svg{width:22px;height:22px}
.bottomtab a.active{color:var(--blue)}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 30px 14px}
.view{display:none}
.view.active{display:block}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 2px 14px rgba(0,0,0,.2);margin-bottom:14px;border:1px solid var(--border)}
.tier-title{font-size:13px;font-weight:700;color:var(--gold);margin:12px 2px 8px;display:flex;align-items:center;gap:6px}
.tier-title .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.stock-row{display:flex;align-items:center;padding:14px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
.stock-row:last-child{border-bottom:none}
.stock-row:active{background:rgba(255,255,255,.03)}
.stock-row .left{flex:1;min-width:0}
.stock-row .symbol{font-size:15px;font-weight:700}
.stock-row .name{font-size:11px;color:var(--sub);margin-top:2px}
.stock-row .center{flex:1;text-align:right}
.stock-row .price{font-size:15px;font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace}
.stock-row .change{font-size:12px;font-weight:600;margin-top:2px}
.stock-row .right{flex:0 0 92px;text-align:right;margin-left:10px}
.stock-row .myqty{font-size:11px;color:var(--sub);background:rgba(255,255,255,.05);padding:2px 6px;border-radius:4px}
.stock-row .cd{font-size:10px;color:var(--sub);margin-top:3px}
.up{color:var(--up)}.down{color:var(--down)}
.pos-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.pos-card:active{background:rgba(255,255,255,.03)}
.pos-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pos-symbol{font-size:15px;font-weight:700}
.pos-name{font-size:11px;color:var(--sub);margin-left:6px}
.pos-pl{font-size:18px;font-weight:800}
.pos-body{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);flex-wrap:wrap;gap:4px}
.pos-body .val{color:var(--text);font-weight:600}
.hero{background:linear-gradient(135deg,#0d2b52,#1a4a86);color:#fff}
.hero .who{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hero .ava{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.hero .meta{line-height:1.4}
.hero .name{font-size:16px;font-weight:700}
.hero .uid{font-size:12px;opacity:.8}
.hero .bal{margin-top:6px}
.hero .bal .l{font-size:12px;opacity:.85}
.hero .bal .n{font-size:28px;font-weight:800;letter-spacing:.5px}
.hero .cny{font-size:13px;opacity:.85;margin-top:4px;font-weight:500}
.stat-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.stat-row:last-child{border-bottom:none}
.stat-row .k{color:var(--sub);font-size:13px}
.stat-row .v{font-weight:700;font-size:15px}
.btn-logout{width:100%;padding:15px;border:none;border-radius:14px;background:rgba(239,68,68,.15);color:var(--down);font-size:16px;font-weight:700;cursor:pointer;margin-top:14px}
.sheet-mask{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.sheet-mask.show{display:flex}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:rise .25s ease;max-height:92vh;overflow-y:auto}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-title{font-size:18px;font-weight:800}
.sheet-sub{font-size:12px;color:var(--sub);margin-top:4px}
.sheet-close{width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:var(--sub);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tab-row{display:flex;gap:8px;margin-bottom:14px}
.tab-btn{flex:1;padding:10px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.06);color:var(--sub)}
.tab-btn.active.buy{background:var(--up);color:#fff}
.tab-btn.active.sell{background:var(--down);color:#fff}
.input-group{margin-bottom:14px}
.input-group label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
input.txt{width:100%;padding:14px 15px;border:1.5px solid var(--border);border-radius:14px;font-size:18px;outline:none;background:rgba(255,255,255,.04);color:var(--text)}
input.txt:focus{border-color:var(--blue);background:var(--card)}
.qty-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.qty-btn{padding:10px 2px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text);font-size:12px;font-weight:700;cursor:pointer}
.qty-btn.gold{color:var(--gold);border-color:rgba(245,197,24,.35);background:rgba(245,197,24,.06)}
.est-row{display:flex;justify-content:space-between;padding:10px 0;font-size:13px}
.est-row .k{color:var(--sub)}.est-row .v{font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace}
.btn-trade{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px;color:#fff}
.btn-trade.buy{background:var(--up)}.btn-trade.sell{background:var(--down)}
.btn-trade[disabled]{background:var(--sub);cursor:not-allowed}
.chartbox{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:8px;margin-bottom:12px;position:relative}
.legend{display:flex;gap:10px;font-size:11px;color:var(--sub);margin-bottom:4px;flex-wrap:wrap;line-height:1.5}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.chart-pct{position:absolute;top:8px;right:12px;font-size:11px;font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace;background:rgba(19,23,34,.85);padding:3px 7px;border-radius:6px;z-index:2;white-space:nowrap}
canvas{width:100%;height:170px;display:block;touch-action:pan-y}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-120px);z-index:200;background:rgba(28,28,30,.96);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);pointer-events:none;transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:86vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#toast.err{background:var(--down)}
.empty{text-align:center;color:var(--sub);font-size:12px;padding:18px}
@keyframes flashUp{0%{background-color:rgba(34,197,94,.25)}100%{background-color:transparent}}
@keyframes flashDown{0%{background-color:rgba(239,68,68,.25)}100%{background-color:transparent}}
.flash-up{animation:flashUp .6s ease}
.flash-down{animation:flashDown .6s ease}
.auth-mask{position:fixed;inset:0;z-index:120;background:rgba(13,43,82,.6);display:none;align-items:flex-end;justify-content:center}
.auth-mask.show{display:flex}
.auth-sheet{width:100%;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:rise .25s ease}
.auth-sheet h2{text-align:center;color:var(--blue);font-size:20px;margin-bottom:6px}
.auth-sheet p.hint{text-align:center;font-size:12px;color:var(--sub);margin-bottom:14px}
.auth-sheet input{margin-bottom:10px}
.auth-toggle{text-align:center;color:var(--blue);font-size:13px;margin-top:8px;cursor:pointer;font-weight:600;padding:8px}
.help-mask{position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.7);display:none;overflow:auto;padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
.help-mask.show{display:block}
.help-sheet{max-width:560px;margin:0 auto;background:var(--card);border-radius:18px;padding:22px 20px;animation:rise .25s ease}
.help-sheet h2{font-size:18px;font-weight:800;margin-bottom:8px}
.help-sheet h3{font-size:14px;font-weight:700;color:var(--gold);margin:14px 0 6px}
.help-sheet p{font-size:13px;line-height:1.7;margin-bottom:6px}
.help-sheet b{color:var(--blue)}
.help-sheet .up{color:var(--up)}.help-sheet .down{color:var(--down)}
.help-sheet .ok-btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:15px;font-weight:700;margin-top:16px;cursor:pointer}
.help-close{float:right;width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:var(--sub);font-size:18px;cursor:pointer}
/* 数据卡片：数值与副行(.v.sub)上下错开，避免叠在一起 */
.data-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.data-card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:12px}
.data-card .l{font-size:10px;color:var(--sub);margin-bottom:6px;line-height:1.3}
.data-card .v{font-size:15px;font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace;display:block}
.data-card .v.sub{color:var(--sub);font-weight:500;font-size:11px;margin-top:4px;display:block;line-height:1.3}
</style>
</head>
<body>

<div id="toast"></div>

<header class="brandbar">
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="#2a90ff"/></svg>
    <div><div>AUR 证券</div><div class="brand-sub">实时行情，全球交易</div></div>
  </div>
  <div style="display:flex;align-items:center">
    <span id="rtDot" style="width:8px;height:8px;border-radius:50%;background:var(--sub);margin-right:8px;display:inline-block"></span>
    <button class="balance-btn"><span id="headerBal">--</span> AUR</button>
    <button class="help-btn" id="helpBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1" fill="currentColor"/></svg> 帮助</button>
  </div>
</header>

<main class="wrap">
  <section class="view active" id="v-market">
    <div class="card" style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-size:12px;color:var(--sub)">下一轮价格更新</div><div id="countdown" style="font-weight:700;font-size:15px;color:var(--gold)">--</div></div>
      <div style="text-align:right"><div style="font-size:12px;color:var(--sub)">同步状态</div><div id="rtStatus" style="font-weight:700;font-size:12px">连接中…</div></div>
    </div>
    <div id="marketList"><div class="empty">加载中...</div></div>
  </section>
  <section class="view" id="v-positions">
    <div class="card"><div class="stat-row"><span class="k">持仓市值</span><span class="v" id="posValue">0.00</span></div><div class="stat-row"><span class="k">未实现盈亏</span><span class="v" id="posPL">0.00</span></div></div>
    <div id="posList"><div class="empty">暂无持仓</div></div>
  </section>
  <section class="view" id="v-me">
    <div class="card hero">
      <div class="who"><div class="ava"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.5" r="3.5" fill="#fff"/><path d="M5 20c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></div><div class="meta"><div class="name" id="meName">--</div><div class="uid" id="meUid">UID · --</div></div></div>
      <div class="bal"><div class="l">现金余额</div><div class="n" id="meBal">0.00</div><div class="cny" id="meTotal">总资产: 0.00 AUR</div></div>
    </div>
    <div class="card"><div class="stat-row"><span class="k">数据模式</span><span class="v" id="meMode">--</span></div><div class="stat-row"><span class="k">今日交易</span><span class="v" id="meTrades">0</span></div></div>
    <button class="btn-logout" id="btnLogout">退出登录</button>
  </section>
</main>

<nav class="bottomtab">
  <a href="#market" data-view="market" class="active"><svg viewBox="0 0 24 24" fill="none"><path d="M3 3v18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 14l4-4 4 4 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>行情</span></a>
  <a href="#positions" data-view="positions"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="9" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="5" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="12" width="7" height="9" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="16" width="7" height="5" rx="1" stroke="currentColor" stroke-width="2"/></svg><span>持仓</span></a>
  <a href="#me" data-view="me"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.5" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M5 20c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>我的</span></a>
</nav>

<div class="auth-mask" id="authMask">
  <div class="auth-sheet">
    <h2 id="authTitle">登录 AUR 证券</h2>
    <p class="hint" id="authHint">使用主站(云端矿场)用户名和密码登录</p>
    <input class="txt" id="auUser" placeholder="主站用户名" autocomplete="off" style="margin-bottom:10px">
    <input class="txt" id="auPass" type="password" placeholder="主站密码" autocomplete="off" style="margin-bottom:6px">
    <button class="btn-trade buy" id="authBtn" style="margin-top:8px">登录</button>
    <div class="auth-toggle" id="authToggle">还没有账号？去主站注册</div>
  </div>
</div>

<div class="sheet-mask" id="tradeMask">
  <div class="sheet">
    <div class="sheet-header"><div><div class="sheet-title" id="tradeSymbol">--</div><div class="sheet-sub" id="tradeSub">--</div></div><button class="sheet-close" id="tradeClose">✕</button></div>
    <div class="chartbox"><div class="legend"><span><i style="background:var(--blue)"></i>价格(全部历史点)</span><span><i style="background:var(--gold)"></i>MA5 近5次均值</span><span><i style="background:var(--up)"></i>MA10 近10次均值</span><span class="sub" id="chartNote">--</span></div><span class="chart-pct" id="chartPct">--</span><canvas id="chart"></canvas></div>
    <div class="data-cards">
      <div class="data-card"><div class="l">近 30 次行情(实时)</div><span class="v" id="dPrice">--</span><span class="v sub" id="dPct">--</span><span class="v sub" id="dHist">等待行情更新…</span></div>
      <div class="data-card"><div class="l">我的持仓(实时)</div><span class="v" id="dQty">未持仓</span><span class="v sub" id="dCost">--</span><span class="v sub" id="dPL">买入后显示盈亏</span></div>
    </div>
    <div class="tab-row"><button class="tab-btn buy active" id="tabBuy">买入</button><button class="tab-btn sell" id="tabSell">卖出</button></div>
    <div class="input-group"><label>数量</label><input class="txt" id="tradeQty" type="number" min="1" step="1" placeholder="输入股数" inputmode="numeric"></div>
    <div class="qty-btns"><button class="qty-btn" data-q="10">10</button><button class="qty-btn" data-q="50">50</button><button class="qty-btn" data-q="100">100</button><button class="qty-btn" data-q="500">500</button><button class="qty-btn gold" id="btnAll">全部</button></div>
    <div class="est-row"><span class="k">预估金额</span><span class="v" id="tradeEst">-- AUR</span></div>
    <div class="est-row"><span class="k">可用</span><span class="v" id="tradeAvail">--</span></div>
    <button class="btn-trade buy" id="tradeBtn">确认买入</button>
  </div>
</div>

<div class="help-mask" id="helpMask"><div class="help-sheet" id="helpBox"></div></div>

<script>
(function(){
  'use strict';
  var SUPABASE_URL = 'https://irnaphrjcdfmqyykdron.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlybmFwaHJqY2RmbXF5eWtkcm9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDUzNzIsImV4cCI6MjEwMzI4MTM3Mn0.4FNlvN4GfVSmYQTr2ZelAc96EavUohqbLURirbeIUlI';

  function showToast(msg, isErr){var t=document.getElementById('toast');t.textContent=msg;t.classList.toggle('err',!!isErr);t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2800)}
  if(typeof window.supabase==='undefined'||!window.supabase.createClient){showToast('网络异常：Supabase SDK 加载失败',true);return}
  if(typeof window.sha256!=='function'){showToast('网络异常：加密库加载失败',true);return}
  var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

  var me=null,stocks=[],holdings={},trades=[],hist={},curSym='',curSide='buy',online=false,tickLeft=15,tickTimer=null,_seen={};
  var $ = function(id){return document.getElementById(id)};
  // 安全取值/赋值：元素不存在时静默跳过，避免中间一步抛错导致后续刷新全部中断
  var setTxt=function(id,v){var e=$(id);if(e)e.textContent=v};
  var setCls=function(id,v){var e=$(id);if(e)e.className=v};
  var views={market:$('v-market'),positions:$('v-positions'),me:$('v-me')};
  var tabLinks=document.querySelectorAll('.bottomtab a');
  var fmt=function(n,d){d=d||2;return Number(n||0).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})};
  var cls=function(n){return n>0?'up':(n<0?'down':'sub')};

  try{var _c=localStorage.getItem('aur_me');if(_c)me=JSON.parse(_c)}catch(e){}

  function switchView(name){Object.keys(views).forEach(function(k){views[k].classList.toggle('active',k===name)});tabLinks.forEach(function(a){a.classList.toggle('active',a.dataset.view===name)});if(name!=='market')history.replaceState(null,'','#'+name);if(name==='positions')renderPositions();if(name==='me')renderMe()}
  tabLinks.forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();if(!me){openAuth();return}switchView(a.dataset.view)})});

  // ===== 登录(分站独立 UI，认证走主站 wallets 表) =====

  // ===== 持仓 =====

  // ===== 交易弹窗 =====
  function openTrade(sym,side){side=side||'buy';curSym=sym;curSide=side;var s=stocks.find(function(x){return x.symbol===sym});if(!s)return;$('tradeSymbol').textContent=sym+' · '+s.name;refreshTradeHead();loadHistory(sym,function(){try{drawChart();renderDataCards()}catch(e){}});renderDataCards();$('tradeQty').value='';$('tradeBtn').className='btn-trade '+side;$('tradeBtn').textContent=side==='buy'?'确认买入':'确认卖出';$('tabBuy').classList.toggle('active',side==='buy');$('tabSell').classList.toggle('active',side==='sell');updateTradeEst();$('tradeMask').classList.add('show')}

  // 弹窗两栏真实数据卡片(随 tick 实时刷新；全部走安全取值)
  function renderDataCards(){

    setTxt('dPrice',fmt(s.price));

    var h=holdings[curSym];if(h){var pl=(s.price-h.avg_cost)*h.qty,pp=h.avg_cost>0?pl/h.avg_cost*100:0;setTxt('dQty',h.qty+' 股');setTxt('dCost','成本 '+fmt(h.avg_cost));setTxt('dPL',(pl>=0?'+':'')+fmt(pl)+' ('+(pp>=0?'+':'')+fmt(pp,2)+'%)');setCls('dPL','v sub '+(pl>=0?'up':'down'))}
    else{setTxt('dQty','未持仓');setTxt('dCost','--');setTxt('dPL','买入后显示盈亏');setCls('dPL','v sub')}

  function loadHistory(sym,cb){sb.from('stock_history').select('price,created_at').eq('symbol',sym).order('id',{ascending:false}).limit(30).then(function(r){var el=[];(r.data||[]).slice().reverse().forEach(function(x){el.push(Number(x.price))});hist[sym]=el;if(curSym===sym){if(cb)cb()}}).catch(function(){if(cb)cb()})}
  $('tradeBtn').addEventListener('click',function(){
    if(!curSym)return;var q=parseInt($('tradeQty').value);if(!q||q<=0)return showToast('请输入有效数量',true);

      var msg=curSide==='buy'?'买入成功，花费 '+fmt(res.data.cost)+' AUR':'卖出成功，获得 '+fmt(res.data.proceeds||res.data.value)+' AUR';

  // ===== Canvas 趋势图(画全部历史点；MA5/MA10 不足样本时优雅跳过；chartPct 安全取值)=====
  function drawChart(){
    var s=stocks.find(function(x){return x.symbol===curSym});if(!s)return;
    var c=$('chart');if(!c)return;var ctx=c.getContext('2d');var dpr=window.devicePixelRatio||1;c.width=c.clientWidth*dpr;c.height=170*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,c.clientWidth,170);
    var arr=(hist[curSym]&&hist[curSym].length?hist[curSym]:[s.price]).slice();while(arr.length<2)arr.push(arr[0]);
    var mn=Math.min.apply(null,arr.concat([s.base_price]))*.99,mx=Math.max.apply(null,arr.concat([s.base_price]))*1.01;if(mn===mx){mx=mn*1.02||1}
    var x=function(i){return 10+i*(c.clientWidth-20)/Math.max(arr.length-1,1)};
    var y=function(v){return 150-((v-mn)/(mx-mn))*130};
    ctx.strokeStyle='#1e2330';ctx.lineWidth=1;for(var i=0;i<4;i++){ctx.beginPath();ctx.moveTo(10,10+i*140/3);ctx.lineTo(c.clientWidth-10,10+i*140/3);ctx.stroke()}
    ctx.strokeStyle='#2a90ff';ctx.lineWidth=2;ctx.beginPath();arr.forEach(function(v,i){i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v))});ctx.stroke();
    var ma=function(n){var out=[];for(var i=0;i<arr.length;i++){if(i<n-1){out.push(null);continue}var sl=arr.slice(i-n+1,i+1);out.push(sl.reduce(function(a,b){return a+b},0)/n)}return out};
    var ma5=ma(5);ctx.strokeStyle='#f5c518';ctx.lineWidth=1.5;ctx.beginPath();var pen=false;ma5.forEach(function(v,i){if(v==null){pen=false;return}if(!pen){ctx.moveTo(x(i),y(v));pen=true}else{ctx.lineTo(x(i),y(v))}});if(pen)ctx.stroke();
    var ma10=ma(10);ctx.strokeStyle='#22c55e';ctx.lineWidth=1.5;ctx.beginPath();pen=false;ma10.forEach(function(v,i){if(v==null){pen=false;return}if(!pen){ctx.moveTo(x(i),y(v));pen=true}else{ctx.lineTo(x(i),y(v))}});if(pen)ctx.stroke();
    ctx.strokeStyle='#f5c518';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(10,y(s.base_price));ctx.lineTo(c.clientWidth-10,y(s.base_price));ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#2a90ff';ctx.beginPath();ctx.arc(x(arr.length-1),y(arr[arr.length-1]),3.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8b92a5';ctx.font='10px sans-serif';arr.forEach(function(v,i){if(i===0||i===arr.length-1||i%Math.ceil(arr.length/5)===0)ctx.fillText(fmt(v),Math.max(10,Math.min(c.clientWidth-30,x(i)-10)),162)});
    var ch=arr.length>=2?(arr[arr.length-1]-arr[0])/arr[0]*100:0;
    setTxt('chartPct',fmt(s.price)+' ('+(ch>=0?'+':'')+ch.toFixed(2)+'%)');setCls('chartPct','chart-pct '+(ch>=0?'up':'down'));
  }

  // ===== 实时订阅(stocks UPDATE + stock_history INSERT；弹窗打开期间折线/数据实时延伸)=====
  function setupRealtime(){
    if(window._rtSub){sb.removeChannel(window._rtSub);window._rtSub=null}
    window._rtSub=sb.channel('stocks-rt')
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'stocks'},function(p){
        var n=p.new;if(!n||!n.symbol)return;
        // 同 updated_at 去重，防止一次 tick 多次触发造成折线重复点/数字闪烁
        if(_seen[n.symbol]===n.updated_at)return;_seen[n.symbol]=n.updated_at;
        var r=stocks.find(function(x){return x.symbol===n.symbol});if(!r)return;
        r.prev_price=r.price;r.price=Number(n.price);r.change=Number(n.change);r.change_pct=Number(n.change_pct);r.updated_at=n.updated_at;
        // 新价追加到历史数组(与 drawChart 读取的是同一引用)，弹窗打开期间折线随 tick 延伸
        hist[n.symbol]=(hist[n.symbol]||[]).concat([Number(n.price)]);if(hist[n.symbol].length>30)hist[n.symbol]=hist[n.symbol].slice(-30);
        renderRow(r);
        if(curSym===n.symbol){try{refreshTradeHead();drawChart();renderDataCards()}catch(e){}}
      })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'stock_history'},function(p){
        var n=p.new;if(!n||!n.symbol)return;
        hist[n.symbol]=(hist[n.symbol]||[]).concat([Number(n.price)]);if(hist[n.symbol].length>30)hist[n.symbol]=hist[n.symbol].slice(-30);
        if(curSym===n.symbol){try{drawChart();renderDataCards()}catch(e){}}
      })
      .subscribe(function(s){setTxt('rtStatus',s==='SUBSCRIBED'?'实时同步 · 全员同数据':'连接中…');var d=$('rtDot');if(d)d.style.background=s==='SUBSCRIBED'?'var(--up)':'var(--sub)'});
  }

  // ===== 倒计时(每15秒驱动一次数据库 tick，全员同步)=====
  function startCountdown(){stopCountdown();tickLeft=15;setTxt('countdown','下一轮 · '+tickLeft+'s');tickTimer=setInterval(function(){tickLeft--;if(tickLeft<=0){tickLeft=15;sb.rpc('tick_stocks').then(function(){loadStocks();loadHoldings()}).catch(function(){})}else{setTxt('countdown','下一轮 · '+tickLeft+'s');document.querySelectorAll('.cdval').forEach(function(e){e.textContent=tickLeft+'s'})}},1000)}
  function stopCountdown(){if(tickTimer){clearInterval(tickTimer);tickTimer=null}}

    +'<h3>2. 行情页</h3><p>三档股票：<b>低档</b>波动小适合练手、<b>中档</b>龙头、<b>高档</b>世界巨头波动大。右侧大数字是现价，下方是<b class="up">涨</b>/<b class="down">跌</b>幅(相对初始价)。<b>价格与涨跌幅颜色始终一致</b>：绿=涨、红=跌。</p>'
    +'<h3>3. 倒计时</h3><p>顶部"下一轮 · 15s"与每只股票下方"↓ 12s"是<b>价格更新倒计时</b>。每 15 秒数据库统一驱动一次价格 tick，所有打开页面的人同时刷新、看到完全相同的数据。</p>'
    +'<h3>4. 买入 / 5. 卖出</h3><p>点股票→弹窗→买入 Tab→输入数量或点 10/50/100/500/<b>全部</b>(全部=用余额能买的最大股数)→确认买入。持仓页点卡片自动切到卖出 Tab，或点股票→卖出→输入数量→确认。</p>'
    +'<h3>6. 怎么赚钱</h3><p>低价买高价卖。持仓页可看每只票的浮盈浮亏。价格每约 15 秒随行情波动。</p>'
    +'<h3>7. 走势图 · 怎么看</h3><p>弹窗上方是这张股票最近 <b>30 次</b>行情的趋势图(数据来自数据库 stock_history 表，全员共享、完全相同)：</p>'
    +'<p>• <b style="color:var(--blue)">蓝色线 = 价格</b>：把最近 30 次历史价从左到右依次连起来，每一轮 tick 新增一个点，折线会实时向右延伸(弹窗开着时也能看到价格跳动、折线生长)。</p>'
    +'<p>• <b style="color:var(--gold)">金色线 = MA5</b>：即"近 5 次历史价的<b>平均值</b>"(Moving Average 5)。样本不足 5 次时不画。</p>'
    +'<p>• <b style="color:var(--up)">绿色线 = MA10</b>：即"近 10 次历史价的<b>平均值</b>"(Moving Average 10)。比 MA5 更平滑，样本不足 10 次时不画。</p>'
    +'<p>• <b style="color:var(--gold)">金色虚线 = 初始价基准</b>：价格线在虚线之上=相对初始价上涨，之下=下跌。右上角显示当前价与区间涨跌幅。</p>'
    +'<h3>8. 弹窗数据实时更新</h3><p>走势图下方两栏：左栏"近 30 次行情"读取数据库 stock_history(实时刷新)；右栏"我的持仓"实时显示该股持仓股数、成本与浮盈亏。<b>弹窗打开期间，每轮 tick 都会触发折线延伸、数据卡片数字更新</b>，无需关闭重开。</p>'
    +'<h3>9. 余额互通 / 10. 实时同步机制</h3><p>余额即主站 wallets.balance：挖矿/做任务赚的 AUR 可直接在此买入，卖出回款实时写回主站。价格由数据库统一 tick，前端通过 PostgREST 实时订阅(stocks UPDATE + stock_history INSERT)自动刷新，无需手动刷新页面。</p>'
    +'<h3>常见问题</h3><p>• <b>余额不足</b>：去主站挖矿赚 AUR 后再来买。<br>• <b>为何所有人数据相同</b>：价格与历史走势都来自同一数据库，全员订阅同一通道，每 15 秒同步一次。<br>• <b>历史保留多久</b>：每只股票最近 30 条，超出由数据库自动删除旧记录(>30 即清理)。<br>• <b>MA5/MA10 没出现</b>：该股历史记录不足 5/10 次，等几轮 tick 积累后即可看到。<br>• <b>清浏览器数据</b>：仅清空本地登录态，需重新登录；云端持仓/余额不受影响。<br>• <b>倒计时到点</b>：触发一次数据库 tick，价格更新、走势图延伸一点，倒计时重置 15s。</p>'
    +'<button class="ok-btn" id="helpOk">知道了</button>';
  function showHelp(){$('helpBox').innerHTML=HELP;$('helpMask').classList.add('show')}
  $('helpBtn').addEventListener('click',showHelp);
  document.addEventListener('click',function(e){if(e.target&&e.target.id==='helpClose'){$('helpMask').classList.remove('show')}if(e.target&&e.target.id==='helpOk'){$('helpMask').classList.remove('show')}});

  // ===== 启动 =====
  function verifyAndShow(){if(!me){openAuth();return}sb.from('wallets').select('id,uid,username,address,balance,last_mine').eq('address',me.address||(me.id||me.uid)).maybeSingle().then(function(r){if(r.error||!r.data){localStorage.removeItem('aur_me');me=null;openAuth();return}me=r.data;try{localStorage.setItem('aur_me',JSON.stringify(me))}catch(e){}onLogin()}).catch(function(){localStorage.removeItem('aur_me');me=null;openAuth()})}
  document.addEventListener('DOMContentLoaded',verifyAndShow);
})();
</script>
