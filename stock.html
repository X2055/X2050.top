<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AUR 证券</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0b0e14;
    --card: #151a21;
    --green: #2ecc71;
    --red: #e74c3c;
    --text: #e0e0e0;
    --sub: #7a8290;
    --border: #22272e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: 70px;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px; background: var(--bg); position: sticky; top: 0; z-index: 10;
  }
  .header-left { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; }
  .logo { color: #3498db; font-size: 20px; }
  .header-right { font-weight: 600; font-size: 16px; }
  .search-bar {
    margin: 0 15px 15px; padding: 10px 15px; background: var(--card);
    border-radius: 8px; display: flex; align-items: center; gap: 10px; color: var(--sub);
  }
  .stock-list { padding: 0 15px; }
  .stock-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 0; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .stock-left { display: flex; flex-direction: column; gap: 4px; }
  .symbol-row { display: flex; align-items: center; gap: 8px; }
  .symbol { font-weight: 700; font-size: 16px; }
  .name { color: var(--sub); font-size: 13px; }
  .tag { background: #222; color: var(--sub); padding: 2px 6px; border-radius: 4px; font-size: 11px; }
  .stock-right { text-align: right; display: flex; flex-direction: column; gap: 4px; }
  .price { font-weight: 600; font-size: 16px; }
  .change { font-size: 13px; }
  .group-title { color: var(--sub); font-size: 13px; margin: 15px 0 5px; }
  .modal-bg {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal {
    background: var(--card); width: 90%; max-width: 350px;
    border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px;
  }
  .modal-header h2 { font-size: 20px; margin-bottom: 5px; }
  .modal-header .sub { color: var(--sub); font-size: 14px; }
  .modal-price { font-size: 28px; font-weight: 700; color: var(--green); }
  .modal-tabs { display: flex; gap: 10px; }
  .tab {
    flex: 1; padding: 12px; text-align: center; border-radius: 8px;
    background: #222; color: var(--sub); cursor: pointer; font-weight: 600;
  }
  .tab.active.buy { background: var(--green); color: #000; }
  .tab.active.sell { background: var(--red); color: #fff; }
  .qty-input {
    width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
    background: #0b0e14; color: #fff; font-size: 16px; outline: none;
  }
  .modal-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--sub); }
  .btn {
    width: 100%; padding: 14px; border: none; border-radius: 8px;
    font-size: 16px; font-weight: 700; cursor: pointer; color: #fff;
  }
  .btn-buy { background: var(--green); }
  .btn-sell { background: var(--red); }
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
    display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--border); z-index: 10;
  }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--sub); font-size: 12px; }
  .nav-item.active { color: #3498db; }
  .debug {
    position: fixed; bottom: 60px; left: 0; right: 0; background: rgba(0,0,0,0.9);
    color: #0f0; font-size: 11px; padding: 10px; max-height: 150px; overflow-y: auto; z-index: 50;
    font-family: monospace; pointer-events: none;
  }
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 20px; border-radius: 20px;
    font-size: 14px; z-index: 200; display: none;
  }
</style>
</head>
<body>
<div class="header">
  <div class="header-left"><span class="logo">⚡</span> AUR 证券</div>
  <div class="header-right" id="balance-display">0 AUR</div>
</div>
<div class="search-bar"><span>🔍</span> AUR 证券</div>
<div class="stock-list" id="stock-list"></div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="m-symbol">MSFT · 微软</h2>
      <div class="modal-price" id="m-price">0.00 AUR</div>
      <div class="sub" id="m-change">▲ 0.00%</div>
    </div>
    <div class="modal-tabs">
      <div class="tab active buy" id="tab-buy">买入</div>
      <div class="tab sell" id="tab-sell">卖出</div>
    </div>
    <input type="number" class="qty-input" id="qty" placeholder="数量（股）" min="1" value="1">
    <div class="modal-info">
      <span id="m-hold">持仓: 0</span>
      <span id="m-cost">预估: 0 AUR</span>
    </div>
    <button class="btn btn-buy" id="confirm-btn">确认买入</button>
  </div>
</div>

<div class="nav">
  <div class="nav-item active"><span>📈</span> 行情</div>
  <div class="nav-item"><span>👤</span> 我的</div>
</div>
<div class="debug" id="dbg"></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://irnaphrjwlgjdfwrykgu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlybmFwaHJqd2xnamRmd3J5a2d1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYyMjcwOTUsImV4cCI6MjA3MTgwMzA5NX0.GW4vA6Hk2iZgQ5XNfUf9XlM4v4Yc8WbBQYJzKjT8f3Y';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const dbg = (t,c='')=>{const e=document.getElementById('dbg');e.innerHTML+=`[${new Date().toLocaleTimeString()}] ${t}<br>`;e.scrollTop=e.scrollHeight;if(c=='e')console.error(t);};
const showToast = (t,b=false)=>{const o=document.getElementById('toast');o.textContent=t;o.style.display='block';o.style.background=b?'#e74c3c':'#333';setTimeout(()=>o.style.display='none',3000);};

dbg('Supabase 初始化...');
let me={uid:null};
let stocks=[];
let cur=null;
let side='buy';

(async()=>{
  const {data:u} = await sb.auth.getUser();
  if(!u?.user){dbg('未登录','e');return;}
  me.uid = u.user.id;
  dbg(`已登录: uid=${me.uid}`);
  await verifyBalance();
  await loadStocks();
  dbg('实时订阅: SUBSCRIBED');
  sb.channel('stocks').on('postgres_changes',{event:'*',schema:'public',table:'stocks'},(p)=>{const i=stocks.findIndex(s=>s.symbol==p.new.symbol);if(i>-1){stocks[i]=p.new;render();}}).subscribe();
})();

async function verifyBalance(){
  const {data,error} = await sb.from('wallets').select('balance').eq('uid',me.uid).single();
  if(error){dbg('查余额失败: '+error.message,'e');return;}
  // 唯一修复点：强转数字，防字符串拼接
  const bal = Number(data.balance)||0;
  document.getElementById('balance-display').textContent = bal.toFixed(2)+' AUR';
  dbg(`余额: ${bal.toFixed(3)}`);
}

async function loadStocks(){
  const {data,error} = await sb.from('stocks').select('*').order('symbol');
  if(error){dbg('查 stocks 失败: '+error.message,'e');return;}
  stocks=data; dbg(`stocks 加载: ${stocks.length} 只`); render();
}

function render(){
  const el=document.getElementById('stock-list');
  let h='<div class="group-title">中档位 · 龙头股</div>';
  stocks.forEach(s=>{
    h+=`<div class="stock-item" onclick="openModal('${s.symbol}')">
      <div class="stock-left"><div class="symbol-row"><span class="symbol">${s.symbol}</span><span class="tag">${s.name||''}</span></div><span class="name">${s.name||''}</span></div>
      <div class="stock-right"><div class="price">${s.price}</div><div class="change" style="color:var(--green)">▲ 0.00%</div></div>
    </div>`;
  });
  el.innerHTML=h;
}

async function openModal(sym){
  cur=stocks.find(s=>s.symbol==ym);
  if(!cur)cur=stocks.find(s=>s.symbol==sym);
  if(!cur)return;
  document.getElementById('m-symbol').textContent=`${cur.symbol} · ${cur.name||''}`;
  document.getElementById('m-price').textContent=`${cur.price} AUR`;
  const {data:h} = await sb.from('holdings').select('qty').eq('uid',me.uid).eq('symbol',cur.symbol).maybeSingle();
  document.getElementById('m-hold').textContent=`持仓: ${h?h.qty:0}`;
  document.getElementById('qty').value=1;
  updCost();
  document.getElementById('modal').style.display='flex';
}

function updCost(){document.getElementById('m-cost').textContent=`预估: ${((Number(cur.price)||0)*(parseInt(document.getElementById('qty').value)||0)).toFixed(2)} AUR`;}
document.getElementById('qty').oninput=updCost;

document.getElementById('tab-buy').onclick=()=>{side='buy';document.getElementById('tab-buy').className='tab active buy';document.getElementById('tab-sell').className='tab sell';document.getElementById('confirm-btn').className='btn btn-buy';document.getElementById('confirm-btn').textContent='确认买入';updCost();};
document.getElementById('tab-sell').onclick=()=>{side='sell';document.getElementById('tab-sell').className='tab active sell';document.getElementById('tab-buy').className='tab buy';document.getElementById('confirm-btn').className='btn btn-sell';document.getElementById('confirm-btn').textContent='确认卖出';updCost();};
document.getElementById('confirm-btn').onclick=confirmTrade;
document.getElementById('modal').onclick=e=>{if(e.target.id=='modal')document.getElementById('modal').style.display='none';};

async function confirmTrade(){
  const q = parseInt(document.getElementById('qty').value,10)||0;
  if(q<=0){showToast('数量无效',true);return;}
  const fn = side=='buy'?'buy_stock':'sell_stock';
  
  // 唯一修复点：严格对齐 SQL 函数签名 p_uid, p_symbol, p_qty
  const args = { p_uid: String(me.uid), p_symbol: cur.symbol, p_qty: q };
  
  dbg(`调用 ${fn}(symbol=${cur.symbol}, qty=${q}, uid=${me.uid})...`);
  const res = await sb.rpc(fn, args);
  
  if(res.error){
    dbg(`${fn} RPC错误: ${res.error.message}`,'e');
    showToast(res.error.message.includes('integer = text')?'参数缓存未刷新，强刷页面试试':(res.error.message||'交易失败'),true);
    return;
  }
  const r = res.data;
  if(r && r.ok===false){
    dbg(`${fn} 业务失败: ${r.error}`,'e');
    showToast(r.error||'交易失败',true);
    return;
  }
  if(r && r.ok){
    dbg(`${fn} 成功, ${r.cost!==undefined?'cost='+Number(r.cost).toFixed(2):(r.value!==undefined?'value='+Number(r.value).toFixed(2):'ok')}`);
    showToast(side=='buy'?`买入成功 花费 ${r.cost!==undefined?Number(r.cost).toFixed(2):'?'} AUR`:`卖出成功 获得 ${r.value!==undefined?Number(r.value).toFixed(2):'?'} AUR`);
    document.getElementById('modal').style.display='none';
    await verifyBalance();
    if(cur) openModal(cur.symbol);
  } else {
    dbg(`${fn} 未知返回: ${JSON.stringify(r)}`,'e');
    showToast('返回异常',true);
  }
}
</script>
</body>
</html>
