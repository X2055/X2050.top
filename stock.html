<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AUR证券</title>
<style>
/* 你原来的CSS，一字未动 */
:root{--bg:#0b0d12;--card:#11141b;--line:#1e2330;--text:#e6e8ee;--sub:#5a6175;--up:#22c55e;--down:#ef4444;--gold:#f5c451;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;font-size:14px;padding-bottom:70px;}
.header{display:flex;align-items:center;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--line);}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:var(--gold);}
.icon-btn{margin-left:auto;background:none;border:none;color:var(--sub);font-size:20px;}
.tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:49px;z-index:10;}
.tab{flex:1;text-align:center;padding:12px 0;color:var(--sub);font-size:13px;}
.tab.active{color:var(--gold);border-bottom:2px solid var(--gold);}
.section-title{padding:14px 16px 6px;font-size:12px;color:var(--sub);letter-spacing:.5px;}
.stock-row{display:grid;grid-template-columns:1fr 80px 70px 50px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);}
.stock-info{display:flex;flex-direction:column;}
.stock-symbol{font-weight:700;font-size:15px;}
.stock-name{font-size:11px;color:var(--sub);margin-top:2px;}
.stock-price{text-align:right;font-weight:600;font-size:15px;}
.stock-change{text-align:right;font-size:12px;}
.stock-holding{text-align:right;font-size:12px;color:var(--sub);}
.up{color:var(--up);}.down{color:var(--down);}
.flash-up{animation:flashU .6s;} .flash-down{animation:flashD .6s;}
@keyframes flashU{0%{background:rgba(34,197,94,.25)}100%{background:transparent}}
@keyframes flashD{0%{background:rgba(239,68,68,.25)}100%{background:transparent}}
.holding-card{background:var(--card);margin:8px 12px;border-radius:10px;padding:12px;}
.holding-top{display:flex;justify-content:space-between;align-items:center;}
.holding-symbol{font-weight:700;}
.holding-mid{display:flex;gap:12px;font-size:12px;color:var(--sub);margin:8px 0;}
.holding-bottom{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);}
.me-card{margin:12px;background:var(--card);border-radius:12px;padding:16px;}
.me-row{display:flex;justify-content:space-between;align-items:center;margin:8px 0;}
.me-label{color:var(--sub);}
.me-val{font-size:18px;font-weight:700;}
.nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--bg);border-top:1px solid var(--line);display:flex;z-index:20;}
.nav-item{flex:1;text-align:center;padding:10px 0;color:var(--sub);font-size:11px;}
.nav-item.active{color:var(--gold);}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:flex-end;justify:center;}
.modal.active{display:flex;}
.modal-box{width:100%;max-width:430px;background:var(--card);border-radius:14px 14px 0 0;padding:16px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.modal-title{font-weight:700;}
.modal-close{color:var(--sub);font-size:18px;background:none;border:none;}
.modal-price{font-size:22px;font-weight:700;}
.modal-change{font-size:13px;margin:4px 0 12px;}
.chart{height:120px;width:100%;}
.trade-tabs{display:flex;gap:8px;margin:12px 0;}
.trade-tab{flex:1;padding:10px;text-align:center;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--sub);}
.trade-tab.active-buy{color:var(--up);border-color:var(--up);}
.trade-tab.active-sell{color:var(--down);border-color:var(--down);}
.qty-input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:16px;margin:8px 0;}
.trade-btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:700;margin-top:8px;}
.trade-btn.buy{background:var(--up);color:#000;}
.trade-btn.sell{background:var(--down);color:#fff;}
.trade-btn:disabled{opacity:.5;}
.recent-list{max-height:120px;overflow:auto;margin-top:10px;}
.recent-item{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);padding:4px 0;}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;z-index:200;display:none;}
.toast.err{background:var(--down);}
.toast.ok{background:var(--up);color:#000;}
.estimate{font-size:12px;color:var(--sub);margin:4px 0 8px;}
.max-hint{font-size:12px;color:var(--sub);display:none;}
#debugToggle{position:fixed;right:12px;bottom:72px;z-index:300;background:#f5c451;color:#000;border:none;border-radius:50%;width:36px;height:36px;font-size:18px;}
#debugPanel{position:fixed;left:8px;right:8px;bottom:62px;max-height:38vh;overflow:auto;background:#050608;border:1px solid #f5c451;border-radius:10px;padding:10px;font:11px/1.5 monospace;color:#e6e8ee;z-index:299;display:none;}
#debugPanel.on{display:block;}
#debugPanel .dok{color:#22c55e;} #debugPanel .derr{color:#ef4444;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">📈 AUR证券</div>
  <button class="icon-btn" onclick="location.reload()">⟳</button>
</div>

<div class="tabs">
  <div class="tab active" id="tabMarket" onclick="switchMain('market')">行情</div>
  <div class="tab" id="tabHoldings" onclick="switchMain('holdings')">持仓</div>
  <div class="tab" id="tabMe" onclick="switchMain('me')">我的</div>
</div>

<div id="marketList"></div>
<div id="holdingsList" style="display:none"></div>
<div id="mePage" style="display:none">
  <div class="me-card">
    <div class="me-row"><span class="me-label">现金余额</span><span class="me-val" id="meBalance">0.00</span></div>
    <div class="me-row"><span class="me-label">持仓市值</span><span class="value" id="meMarketValue">0.00</span></div>
    <div class="me-row"><span class="me-label">今日盈亏</span><span class="value" id="meTodayPL">0.00</span></div>
    <div class="me-row"><span class="me-label">总资产估值</span><span class="value" id="meTotalAsset">0.00 AUR</span></div>
    <button class="trade-btn sell" style="margin-top:14px" onclick="logout()">退出登录</button>
  </div>
</div>

<div class="nav">
  <div class="nav-item active" onclick="switchMain('market')">📈<br>行情</div>
  <div class="nav-item" onclick="switchMain('holdings')">📊<br>持仓</div>
  <div class="nav-item" onclick="switchMain('me')">👤<br>我的</div>
</div>

<div class="modal" id="tradeModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">--</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-price" id="modalPrice">--</div>
    <div class="modal-change" id="modalChange">--</div>
    <canvas class="chart" id="chartCanvas"></canvas>
    <div class="trade-tabs">
      <div class="trade-tab active-buy" id="tabBuy" onclick="switchTradeTab('buy')">买入</div>
      <div class="trade-tab" id="tabSell" onclick="switchTradeTab('sell')">卖出</div>
    </div>
    <input class="qty-input" id="qtyInput" type="number" placeholder="数量" oninput="updateEstimate()">
    <div class="max-hint" id="maxQtyHint">最大可卖: <span id="maxQty">0</span></div>
    <div class="estimate">预计: <span id="estimateAmount">0.00 AUR</span></div>
    <button class="trade-btn buy" id="confirmBtn" onclick="confirmTrade()">确认买入</button>
    <div class="recent-list" id="recentTrades"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<button id="debugToggle" onclick="document.getElementById('debugPanel').classList.toggle('on')">🐞</button>
<div id="debugPanel"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const SUPABASE_URL = 'https://irnaphriwpkfnxnmkqjg.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlybmFwaHJpd3BrZm54bm1rcWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYxODQwOTgsImV4cCI6MjA3MTc2MDA5OH0.VbLq6VhLrw2H7Pk2JkT5jWvKq3lYcJzJmF2aB8X9Zo';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const dp = document.getElementById('debugPanel');
  function dbg(m, e){const t=new Date().toLocaleTimeString(); const c=e?'derr':'dok'; dp.innerHTML+=`<div class="${c}">[${t}] ${m}${e?': '+(e.message||e.code||e):''}</div>`; dp.scrollTop=dp.scrollHeight;}
  window.dbg=dbg;

  dp.innerHTML='<div>调试信息（点右下角🐞关闭）</div>';
  dbg('Supabase 初始化...');
  dbg('Supabase client 就绪');

  var me = JSON.parse(localStorage.getItem('aur_me')||'{}');
  var myUid = me.uid;
  if(!myUid){ location.href='user.html'; return; }
  dbg('已登录: uid='+myUid);

  var stocks={}, holdings={}, currentStock, currentTab='buy';

  function showToast(t,type){var el=document.getElementById('toast');el.textContent=t;el.className='toast '+(type||'');el.style.display='block';setTimeout(()=>el.style.display='none',1800);}
  function switchMain(k){document.getElementById('tabMarket').className='tab'+(k==='market'?' active':'');document.getElementById('tabHoldings').className='tab'+(k==='holdings'?' active':'');document.getElementById('tabMe').className='tab'+(k==='me'?' active':'');document.getElementById('marketList').style.display=k==='market'?'':'none';document.getElementById('holdingsList').style.display=k==='holdings'?'':'none';document.getElementById('mePage').style.display=k==='me'?'':'none';if(k==='holdings')renderHoldings();if(k==='me')refreshMePage();}
  window.switchMain=switchMain;

  function loadStocks(){
    dbg('查询 stocks 表...');
    sb.from('stocks').select('*').order('tier').order('symbol').then(function(r){
      if(r.error){ dbg('stocks 失败', r.error); document.getElementById('marketList').innerHTML='<div style="text-align:center;color:#ef4444;padding:40px 0;">加载失败: '+r.error.message+' (code:'+r.error.code+')</div>'; return; }
      dbg('stocks 加载: '+(r.data||[]).length+'只');
      stocks={}; (r.data||[]).forEach(function(s){stocks[s.symbol]=s;});
      renderMarket();
    }).catch(function(e){ dbg('stocks 异常', e); });
  }

  function verifyBalance(){
    dbg('查询 wallets...');
    sb.from('wallets').select('balance').eq('uid',myUid).single().then(function(r){
      if(r.error){ dbg('wallets 失败', r.error); return; }
      me.balance = r.data.balance; localStorage.setItem('aur_me', JSON.stringify(me));
      dbg('余额: '+Number(me.balance).toFixed(2));
      refreshMePage();
    }).catch(function(e){dbg('wallets 异常',e);});
  }

  function loadHoldings(){
    dbg('查询 holdings...');
    sb.from('holdings').select('*').eq('uid',myUid).then(function(r){
      if(r.error){ dbg('holdings 失败', r.error); return; }
      holdings={}; (r.data||[]).forEach(function(h){holdings[h.symbol]=h;});
      dbg('持仓: '+Object.keys(holdings).length+'只');
      renderHoldings(); refreshMePage();
    }).catch(function(e){dbg('holdings 异常',e);});
  }

  // 实时
  sb.channel('stocks-changes').on('postgres_changes',{event:'UPDATE',schema:'public',table:'stocks'},function(payload){
    console.log('[realtime] stock update:', payload.new.symbol, payload.new.price);
    var old = stocks[payload.new.symbol];
    stocks[payload.new.symbol] = payload.new;
    renderMarketRow(payload.new, old);
    if(currentStock && currentStock.symbol === payload.new.symbol){updateModalPrice(payload.new);drawChart(payload.new);}
  }).subscribe();

  // 行情渲染（原样）
  function renderMarket(){var tiers=[{key:'low',label:'低档位 · 练手股'},{key:'mid',label:'中档位 · 龙头股'},{key:'high',label:'高档位 · 世界巨头'}];var html='';tiers.forEach(function(t){var list=Object.values(stocks).filter(function(s){return s.tier===t.key;});if(!list.length)return;html+='<div class="section-title">'+t.label+'</div>';list.forEach(function(s){html+=buildStockRow(s);});});document.getElementById('marketList').innerHTML=html||'<div style="text-align:center;color:#5a6175;font-size:13px;padding:40px 0;">没有可显示的股票</div>';}
  function buildStockRow(s){var isUp=s.change>=0;var arrow=isUp?'▲':'▼';var h=holdings[s.symbol];var holdingText=h?h.qty+'股':'--';return '<div class="stock-row" id="row-'+s.symbol+'" onclick="openTrade(\''+s.symbol+'\')"><div class="stock-info"><span class="stock-symbol">'+s.symbol+'</span><span class="stock-name">'+s.name+'</span></div><div class="stock-price '+(isUp?'up':'down')+'" id="price-'+s.symbol+'">'+Number(s.price).toFixed(2)+'</div><div class="stock-change '+(isUp?'up':'down')+'" id="change-'+s.symbol+'">'+arrow+' '+Math.abs(s.change_pct||0).toFixed(2)+'%</div><div class="stock-holding">'+holdingText+'</div></div>';}
  function renderMarketRow(s,old){var row=document.getElementById('row-'+s.symbol);if(!row){renderMarket();return;}var priceEl=document.getElementById('price-'+s.symbol);var changeEl=document.getElementById('change-'+s.symbol);if(priceEl){priceEl.textContent=Number(s.price).toFixed(2);priceEl.className='stock-price '+(s.change>=0?'up':'down');if(old&&s.price!==old.price){priceEl.classList.remove('flash-up','flash-down');void priceEl.offsetWidth;priceEl.classList.add(s.price>old.price?'flash-up':'flash-down');}}if(changeEl){var isUp=s.change>=0;changeEl.textContent=(isUp?'▲ ':'▼ ')+Math.abs(s.change_pct||0).toFixed(2)+'%';changeEl.className='stock-change '+(isUp?'up':'down');}}

  // 持仓
  function renderHoldings(){var keys=Object.keys(holdings);if(keys.length===0){document.getElementById('holdingsList').innerHTML='<div style="text-align:center;color:#5a6175;font-size:13px;padding:40px 0;">暂无持仓</div>';return;}var html='';keys.forEach(function(sym){var h=holdings[sym],s=stocks[sym];if(!s)return;var pl=(s.price-h.avg_cost)*h.qty;var plPct=h.avg_cost>0?(s.price-h.avg_cost)/h.avg_cost*100:0;var isUp=pl>=0;html+='<div class="holding-card" onclick="openTrade(\''+sym+'\')"><div class="holding-top"><span class="holding-symbol">'+s.symbol+' · '+s.name+'</span><span class="holding-pl '+(isUp?'up':'down')+'">'+(isUp?'+':'')+pl.toFixed(2)+' AUR</span></div><div class="holding-mid"><span>持仓 '+h.qty+' 股</span><span>成本 '+Number(h.avg_cost).toFixed(2)+'</span><span>现价 '+Number(s.price).toFixed(2)+'</span></div><div class="holding-bottom"><span>'+(isUp?'+':'')+plPct.toFixed(2)+'%</span><span>市值 '+(h.qty*s.price).toFixed(2)+' AUR</span></div></div>';});document.getElementById('holdingsList').innerHTML=html;}
  function refreshMePage(){var totalMV=0,totalPL=0;Object.keys(holdings).forEach(function(sym){var h=holdings[sym],s=stocks[sym];if(!s)return;totalMV+=h.qty*s.price;totalPL+=(s.price-h.avg_cost)*h.qty;});document.getElementById('meBalance').textContent=Number(me.balance||0).toFixed(2);document.getElementById('meTotalAsset').textContent='总资产估值: '+(Number(me.balance||0)+totalMV).toFixed(2)+' AUR';document.getElementById('meMarketValue').textContent=totalMV.toFixed(2);var plEl=document.getElementById('meTodayPL');plEl.textContent=(totalPL>=0?'+':'')+totalPL.toFixed(2);plEl.className='value '+(totalPL>=0?'up':'down');}

  // 弹窗
  window.openTrade=function(symbol){currentStock=stocks[symbol];if(!currentStock)return;currentTab='buy';document.getElementById('tabBuy').className='trade-tab active-buy';document.getElementById('tabSell').className='trade-tab';document.getElementById('qtyInput').value='';document.getElementById('maxQtyHint').style.display='none';updateModalPrice(currentStock);drawChart(currentStock);loadRecentTrades(symbol);document.getElementById('tradeModal').classList.add('active');};
  window.closeModal=function(){document.getElementById('tradeModal').classList.remove('active');currentStock=null;};
  window.switchTradeTab=function(tab){currentTab=tab;document.getElementById('tabBuy').className='trade-tab '+(tab==='buy'?'active-buy':'');document.getElementById('tabSell').className='trade-tab '+(tab==='sell'?'active-sell':'');var btn=document.getElementById('confirmBtn');if(tab==='buy'){btn.className='trade-btn buy';btn.textContent='确认买入';document.getElementById('maxQtyHint').style.display='none';}else{btn.className='trade-btn sell';btn.textContent='确认卖出';var h=holdings[currentStock.symbol];if(h){document.getElementById('maxQtyHint').style.display='inline';document.getElementById('maxQty').textContent=h.qty;}}updateEstimate();};
  function updateModalPrice(s){var isUp=s.change>=0;var arrow=isUp?'▲':'▼';document.getElementById('modalPrice').textContent=Number(s.price).toFixed(2)+' AUR';document.getElementById('modalPrice').className='price '+(isUp?'up':'down');document.getElementById('modalChange').textContent=arrow+' '+Math.abs(s.change_pct||0).toFixed(2)+'%';document.getElementById('modalChange').className='change '+(isUp?'up':'down');document.getElementById('modalTitle').textContent=s.symbol+' · '+s.name;}
  function drawChart(s){var canvas=document.getElementById('chartCanvas');var ctx=canvas.getContext('2d');canvas.width=canvas.offsetWidth*2;canvas.height=canvas.offsetHeight*2;ctx.scale(2,2);var w=canvas.offsetWidth,h=canvas.offsetHeight;ctx.clearRect(0,0,w,h);var points=[];var base=s.prev_close||s.price;var current=s.price;for(var i=0;i<40;i++){var ratio=i/39;var noise=(Math.random()-0.5)*base*0.04;points.push(base*0.98+noise+(current-base*0.98)*ratio);}points[39]=current;var min=Math.min.apply(null,points),max=Math.max.apply(null,points);var range=max-min||1;ctx.beginPath();ctx.moveTo(0,h-(points[0]-min)/range*h);for(var i=1;i<points.length;i++){ctx.lineTo(i/(points.length-1)*w,h-(points[i]-min)/range*h);}ctx.strokeStyle=s.change>=0?'#22c55e':'#ef4444';ctx.lineWidth=2;ctx.stroke();ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();var grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,(s.change>=0?'rgba(34,197,94,':'rgba(239,68,68,')+'0.15)');grad.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=grad;ctx.fill();}
  window.setQty=function(q){document.getElementById('qtyInput').value=q;updateEstimate();};
  window.updateEstimate=function(){if(!currentStock)return;var qty=parseFloat(document.getElementById('qtyInput').value)||0;document.getElementById('estimateAmount').textContent=(qty*currentStock.price).toFixed(2)+' AUR';};
  function loadRecentTrades(symbol){sb.from('stock_trades').select('*').eq('symbol',symbol).order('created_at',{ascending:false}).limit(8).then(function(r){var html='';if(r.data&&r.data.length){r.data.forEach(function(t){var isBuy=t.side==='buy';html+='<div class="recent-item"><span class="'+(isBuy?'up':'down')+'">'+(isBuy?'买入':'卖出')+'</span><span>'+t.qty+'股 @ '+Number(t.price).toFixed(2)+'</span></div>';});}else{html='<div style="color:#5a6175;font-size:12px;">暂无成交记录</div>';}document.getElementById('recentTrades').innerHTML=html;});}
  window.confirmTrade=function(){if(!currentStock)return;var qty=parseFloat(document.getElementById('qtyInput').value);if(!qty||qty<=0){showToast('请输入有效数量','err');return;}var btn=document.getElementById('confirmBtn');btn.disabled=true;if(currentTab==='buy'){sb.rpc('buy_stock',{p_uid:String(myUid),p_symbol:currentStock.symbol,p_qty:qty}).then(function(res){btn.disabled=false;if(res.error){showToast(res.error.message||'买入失败','err');return;}var r=res.data;if(r&&r.error){showToast(r.error,'err');return;}showToast('买入成功！','ok');closeModal();verifyBalance();loadHoldings();}).catch(function(e){btn.disabled=false;showToast('网络错误','err');});}else{sb.rpc('sell_stock',{p_uid:String(myUid),p_symbol:currentStock.symbol,p_qty:qty}).then(function(res){btn.disabled=false;if(res.error){showToast(res.error.message||'卖出失败','err');return;}var r=res.data;if(r&&r.error){showToast(r.error,'err');return;}showToast('卖出成功！','ok');closeModal();verifyBalance();loadHoldings();}).catch(function(e){btn.disabled=false;showToast('网络错误','err');});}};
  window.logout=function(){localStorage.removeItem('aur_me');location.href='user.html';};

  loadStocks();
  verifyBalance();
  loadHoldings();
})();
</script>
</body>
</html>
