<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AUR证券</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b0e14;--card:#12161f;--gold:#f5c518;--green:#22c55e;--red:#ef4444;--text:#e5e7eb;--sub:#5a6175}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding-bottom:70px;font-size:14px}
header{position:sticky;top:0;z-index:50;background:rgba(11,14,20,0.95);backdrop-filter:blur(8px);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1f2937}
.logo{color:var(--gold);font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.balance{color:var(--sub);font-size:12px}
.tabs{display:flex;background:#0f131b;padding:4px;position:sticky;top:53px;z-index:40;border-bottom:1px solid #1f2937}
.tab{flex:1;text-align:center;padding:10px;color:var(--sub);font-weight:600;border-radius:6px}
.tab.active{background:#1a2030;color:var(--gold)}
.sec{padding:12px 12px 20px}
.sec-h{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:8px;text-transform:uppercase}
.stock-row{background:var(--card);border-radius:10px;padding:12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto 90px;gap:10px;align-items:center;cursor:pointer;border:1px solid #1f2937}
.s-name{font-weight:700;font-size:15px}.s-sym{font-size:11px;color:var(--sub);margin-top:2px}
.s-price{text-align:right;font-weight:700;font-size:15px}.s-chg{text-align:right;font-size:12px;margin-top:2px}
.s-hold{text-align:right;font-size:11px;color:var(--sub);background:#1a2030;padding:4px 6px;border-radius:4px;white-space:nowrap}
.up{color:var(--green)}.down{color:var(--red)}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:13px}
.hold-card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #1f2937}
.hold-top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.hold-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;color:var(--sub)}
.hold-stats b{color:var(--text);display:block;font-size:13px;margin-top:2px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0b0e14;border-top:1px solid #1f2937;display:flex;height:60px;z-index:50}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);font-size:11px;gap:4px}
.nav-item.active{color:var(--gold)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);width:100%;max-width:360px;border-radius:14px;padding:16px;border:1px solid #2d3748;max-height:90vh;overflow-y:auto}
.m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.m-title{font-weight:800;font-size:16px}.m-close{color:var(--sub);font-size:20px;cursor:pointer}
.m-tabs{display:flex;background:#0b0e14;padding:4px;border-radius:6px;margin-bottom:12px}
.m-tab{flex:1;text-align:center;padding:8px;border-radius:4px;font-weight:700;font-size:13px;color:var(--sub)}
.m-tab.active.buy{background:var(--green);color:#000}.m-tab.active.sell{background:var(--red);color:#fff}
.m-row{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:8px 0}
.m-input{width:100%;background:#0b0e14;border:1px solid #2d3748;color:var(--text);padding:12px;border-radius:8px;font-size:16px;outline:none}
.m-qty{display:flex;gap:8px;margin:10px 0}
.m-qty div{flex:1;text-align:center;padding:6px;background:#1a2030;border-radius:4px;font-size:12px;color:var(--sub);cursor:pointer}
.m-btn{width:100%;padding:14px;border:none;border-radius:8px;font-weight:800;font-size:16px;margin-top:12px;cursor:pointer}
.m-btn.buy{background:var(--green);color:#000}.m-btn.sell{background:var(--red);color:#fff}
.recent-item{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid #1f2937}
.chart-canvas{width:100%;height:80px;margin:8px 0}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a2030;color:var(--text);padding:10px 16px;border-radius:20px;z-index:200;font-size:13px;border:1px solid #2d3748;display:none}
#debug{position:fixed;bottom:65px;left:10px;right:10px;background:rgba(0,0,0,0.9);border:1px solid var(--gold);color:#ffcc00;font-size:11px;padding:10px;border-radius:8px;z-index:99;max-height:180px;overflow-y:auto;display:none;font-family:monospace;line-height:1.5}
#debugBtn{position:fixed;bottom:70px;right:10px;background:var(--gold);color:#000;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:100;font-size:16px}
</style>
</head>
<body>
<header><div class="logo">📈 AUR证券</div><div class="balance" id="balTxt">-- AUR</div></header>
<div class="tabs">
  <div class="tab active" onclick="swTab('mkt')">行情</div>
  <div class="tab" onclick="swTab('hold')">持仓</div>
  <div class="tab" onclick="swTab('me')">我的</div>
</div>
<div id="vMkt" class="sec"><div class="sec-h"><span>低风险</span><span id="lowCnt"></span></div><div id="lowList"></div><div class="sec-h"><span>中风险</span></div><div id="midList"></div><div class="sec-h"><span>高风险</span></div><div id="highList"></div></div>
<div id="vHold" class="sec" style="display:none"><div class="sec-h"><span>我的持仓</span><span id="tv"></span></div><div id="holdList"></div></div>
<div id="vMe" class="sec" style="display:none"><div class="hold-card"><div class="hold-top">UID <span id="meUid"></span></div><div class="hold-stats"><div>余额<b id="meBal"></b></div><div>持仓市值<b id="meMv"></b></div><div>今日盈亏<b id="mePnl"></b></div></div><div style="margin-top:16px"><div class="stock-row" onclick="logout()" style="grid-template-columns:1fr;cursor:pointer"><div class="s-name">退出登录</div></div></div></div>
<div class="bottom-nav"><div class="nav-item active" id="ni1" onclick="swTab('mkt')">📈<span>行情</span></div><div class="nav-item" id="ni2" onclick="swTab('hold')">📊<span>持仓</span></div><div class="nav-item" id="ni3" onclick="swTab('me')">👤<span>我的</span></div></div>
<div class="modal-bg" id="mbg"><div class="modal"><div class="m-head"><div class="m-title" id="mt"></div><div class="m-close" onclick="closeModal()">×</div></div><canvas class="chart-canvas" id="chart"></canvas><div class="m-tabs"><div class="m-tab buy active" id="btb" onclick="swT('buy')">买入</div><div class="m-tab sell" id="bts" onclick="swT('sell')">卖出</div></div><div class="m-row"><span id="mp"></span><span id="mc"></span></div><div class="m-row"><span>可用</span><span id="mb"></span></div><input class="m-input" id="qtyInput" type="number" placeholder="数量" oninput="updateEstimate()"><div class="m-qty"><div onclick="setQty(10)">10</div><div onclick="setQty(50)">50</div><div onclick="setQty(100)">100</div><div onclick="setQty(maxQ())">最大</div></div><div class="m-row"><span>预估</span><span id="estimateAmount">0.00 AUR</span></div><button class="m-btn buy" id="confirmBtn" onclick="confirmTrade()">买入</button><div class="sec-h" style="margin-top:16px"><span>近期成交</span></div><div id="recentTrades"></div></div></div>
<div class="toast" id="toast"></div>
<div id="debugBtn" onclick="document.getElementById('debug').style.display=document.getElementById('debug').style.display=='block'?'none':'block'">🐞</div>
<div id="debug"></div>
<script>
const SUPABASE_URL = 'https://irnaphrjcdfmqyyykdron.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlybmFwaHJqY2RmbXF5eXlrZHJvbiIsInJpZCI6MSwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYwOTQ0ODAsImV4cCI6MjA3MTY3MDQ4MH0.VhJ6T5QJU7Q1N7Z9X3vJv7zQJv8yWzL1K3bP2M5YjQ';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const dlog=(m,c='#ffcc00')=>{const t=new Date().toLocaleTimeString();document.getElementById('debug').innerHTML+=`<div style="color:${c}">[${t}] ${m}</div>`};
dlog('Supabase URL: '+SUPABASE_URL);
dlog('Supabase client 初始化完成','#22c55e');

let myUid=1,myBal=0,currentStock=null,currentTab='buy',holdings=[],stocks=[];
function showToast(m,t){const x=document.getElementById('toast');x.textContent=m;x.style.display='block';x.style.background=t==='ok'?'#22c55e':t==='err'?'#ef4444':'#1a2030';x.style.color='#fff';setTimeout(()=>x.style.display='none',2000)}
function swTab(x){['mkt','hold','me'].forEach(t=>document.getElementById('v'+t.toUpperCase()).style.display=t===x?'block':'none');document.querySelectorAll('.tab').forEach((e,i)=>e.classList.toggle('active',['mkt','hold','me'][i]===x));document.querySelectorAll('.nav-item').forEach((e,i)=>e.classList.toggle('active',['ni1','ni2','ni3'][i]==='ni'+(['mkt','hold','me'].indexOf(x)+1)));if(x==='hold')loadHoldings();if(x==='me')loadMe()}
function swT(t){currentTab=t;document.getElementById('btb').classList.toggle('active',t==='buy');document.getElementById('bts').classList.toggle('active',t==='sell');document.getElementById('confirmBtn').className='m-btn '+t;document.getElementById('confirmBtn').textContent=t==='buy'?'买入':'卖出';updateEstimate()}
function setQty(q){document.getElementById('qtyInput').value=q;updateEstimate()}
function maxQ(){if(!currentStock)return 0;return currentTab==='buy'?Math.floor(myBal/currentStock.price):(holdings.find(h=>h.symbol===currentStock.symbol)?.qty||0)}
function updateEstimate(){if(!currentStock)return;var q=parseFloat(document.getElementById('qtyInput').value)||0;document.getElementById('estimateAmount').textContent=(q*currentStock.price).toFixed(2)+' AUR'}
function openModal(s,t){currentStock=s;currentTab=t;swT(t);document.getElementById('mt').textContent=s.name+' ('+s.symbol+')';document.getElementById('mp').textContent='¥'+s.price.toFixed(2);document.getElementById('mc').textContent=(s.change>=0?'+':'')+s.change.toFixed(2)+'%';document.getElementById('mc').className=s.change>=0?'up':'down';document.getElementById('mb').textContent=myBal.toFixed(2)+' AUR';setQty(t==='buy'?10:1);drawChart(s);loadRecentTrades(s.symbol);document.getElementById('mbg').style.display='flex'}
function closeModal(){document.getElementById('mbg').style.display='none'}
function drawChart(s){const c=document.getElementById('chart'),ctx=c.getContext('2d');c.width=c.offsetWidth;c.height=80;let pts=[];let p=s.price*(1-s.change/100);for(let i=0;i<30;i++){p+=(Math.random()-0.5)*s.price*0.02;pts.push(p)}pts[pts.length-1]=s.price;const min=Math.min(...pts),max=Math.max(...pts),h=80,w=c.width;ctx.clearRect(0,0,w,h);ctx.beginPath();ctx.moveTo(0,h-(pts[0]-min)/(max-min)*h);for(let i=1;i<pts.length;i++)ctx.lineTo(i/(pts.length-1)*w,h-(pts[i]-min)/(max-min)*h);ctx.strokeStyle=s.change>=0?'#22c55e':'#ef4444';ctx.lineWidth=2;ctx.stroke();ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();var g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,(s.change>=0?'rgba(34,197,94,':'rgba(239,68,68,')+'0.15)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fill()}
function loadRecentTrades(sym){sb.from('stock_trades').select('*').eq('symbol',sym).order('created_at',{ascending:false}).limit(8).then(r=>{var h='';if(r.data&&r.data.length)r.data.forEach(t=>{var b=t.side==='buy';h+=`<div class="recent-item"><span class="${b?'up':'down'}">${b?'买入':'卖出'}</span><span>${t.qty}股 @ ${Number(t.price).toFixed(2)}</span></div>`});else h='<div style="color:#5a6175;font-size:12px">暂无</div>';document.getElementById('recentTrades').innerHTML=h})}
function confirmTrade(){if(!currentStock)return;var q=parseFloat(document.getElementById('qtyInput').value);if(!q||q<=0){showToast('数量无效','err');return}var b=document.getElementById('confirmBtn');b.disabled=true;var fn=currentTab==='buy'?'buy_stock':'sell_stock';sb.rpc(fn,{p_uid:String(myUid),p_symbol:currentStock.symbol,p_qty:q}).then(r=>{b.disabled=false;if(r.error){dlog('交易失败: '+r.error.message,'#ef4444');showToast(r.error.message||'失败','err');return}if(r.data&&r.data.error){showToast(r.data.error,'err');return}showToast(currentTab==='buy'?'买入成功':'卖出成功','ok');closeModal();verifyBalance();loadHoldings()}).catch(e=>{b.disabled=false;dlog('交易异常: '+e.message,'#ef4444');showToast('网络错误','err')})}
function logout(){localStorage.removeItem('aur_me');location.href='user.html'}
function renderStocks(){['low','mid','high'].forEach(t=>document.getElementById(t+'List').innerHTML='');var lc=0;stocks.forEach(s=>{var h=holdings.find(x=>x.symbol===s.symbol);var html=`<div class="stock-row" onclick="openModal(${JSON.stringify(s).replace(/"/g,'&quot;')},'buy')"><div><div class="s-name">${s.name}</div><div class="s-sym">${s.symbol}${h?` · 持${h.qty}`:''}</div></div><div><div class="s-price ${s.change>=0?'up':'down'}">${s.price.toFixed(2)}</div><div class="s-chg ${s.change>=0?'up':'down'}">${s.change>=0?'+':''}${s.change.toFixed(2)}%</div></div><div class="s-hold">${h?h.qty+'股':'--'}</div></div>`;document.getElementById(s.tier+'List').innerHTML+=html;if(s.tier==='low')lc++});document.getElementById('lowCnt').textContent=lc+'只';if(!stocks.length)document.getElementById('lowList').innerHTML='<div class="empty">没有可显示的股票</div>'}
function renderHoldings(){var hl=document.getElementById('holdList');if(!holdings.length){hl.innerHTML='<div class="empty">暂无持仓</div>';return}var tv=0;hl.innerHTML=holdings.map(h=>{var s=stocks.find(x=>x.symbol===h.symbol)||{};var mv=h.qty*s.price||0,tv2=mv-(h.qty*s.cost||0);tv+=tv2;return`<div class="hold-card" onclick="openModal(${JSON.stringify(s).replace(/"/g,'&quot;')},'sell')"><div class="hold-top"><span>${s.name||h.symbol}</span><span class="${tv2>=0?'up':'down'}">${tv2>=0?'+':''}${tv2.toFixed(2)}</span></div><div class="hold-stats"><div>持仓<b>${h.qty}股</b></div><div>成本<b>${(s.cost||0).toFixed(2)}</b></div><div>市值<b>${mv.toFixed(2)}</b></div></div></div>`}).join('');document.getElementById('tv').textContent='总盈: '+(tv>=0?'+':'')+tv.toFixed(2)}
function loadMe(){document.getElementById('meUid').textContent=myUid;document.getElementById('meBal').textContent=myBal.toFixed(2);var mv=holdings.reduce((a,b)=>a+b.qty*(stocks.find(x=>x.symbol===b.symbol)?.price||0),0);document.getElementById('meMv').textContent=mv.toFixed(2);var pnl=holdings.reduce((a,b)=>a+b.qty*((stocks.find(x=>x.symbol===b.symbol)?.price||0)-(b.cost||0)),0);document.getElementById('mePnl').textContent=(pnl>=0?'+':'')+pnl.toFixed(2)}

async function verifyBalance(){dlog('查询 wallets 表: uid='+myUid);try{const{r,e}=await sb.from('wallets').select('balance').eq('uid',myUid).single();if(e){dlog('wallets 查询失败: '+(e.message||e.code||e),'#ef4444');return}myBal=r?r.balance:0;document.getElementById('balTxt').textContent=myBal.toFixed(2)+' AUR';document.getElementById('meBal').textContent=myBal.toFixed(2);dlog('余额: '+myBal,'#22c55e')}catch(ex){dlog('wallets 异常: '+ex.message,'#ef4444')}}
async function loadStocks(){dlog('查询 stocks 表...');try{const{r,e}=await sb.from('stocks').select('*').order('tier').order('symbol');if(e){dlog('stocks 查询失败: '+(e.message||e.code||e),'#ef4444');document.getElementById('lowList').innerHTML='<div class="empty">加载失败(见调试)</div>';return}stocks=r||[];dlog('stocks 加载: '+stocks.length+'只','#22c55e');renderStocks()}catch(ex){dlog('stocks 异常: '+ex.message,'#ef4444')}}
async function loadHoldings(){dlog('查询 holdings 表...');try{const{r,e}=await sb.from('holdings').select('*').eq('uid',myUid);if(e){dlog('holdings 失败: '+e.message,'#ef4444');return}holdings=r||[];dlog('持仓加载: '+holdings.length+'只','#22c55e');renderHoldings();renderStocks();loadMe()}catch(ex){dlog('holdings 异常: '+ex.message,'#ef4444')}}

(async()=>{
  var m=localStorage.getItem('aur_me');if(m)try{var p=JSON.parse(m);if(p.uid)myUid=p.uid}catch(e){}dlog('已登录: uid='+myUid+', balance=待查');
  await verifyBalance();await loadStocks();await loadHoldings();
})();
</script>
</body>
</html>
