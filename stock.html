<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AUR 证券</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#0a0b0f;--gold:#f5c451;--dim:#5a6175;--green:#22c55e;--red:#ef4444;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:#e6e6e6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;padding-bottom:70px;}
  .top{display:flex;justify-content:space-between;align-items:center;padding:16px;background:#0d0e13;border-bottom:1px solid #1e2128;}
  .logo{color:var(--gold);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;}
  .logo-icon{width:18px;height:18px;background:var(--gold);clip-path:polygon(0 0,100% 0,100% 60%,0 100%);}
  .bal{color:var(--dim);font-size:13px;}
  .tabs{display:flex;padding:0 16px;gap:24px;background:#0d0e13;border-bottom:1px solid #1e2128;}
  .tab{padding:14px 0;color:var(--dim);position:relative;}
  .tab.on{color:var(--gold);}
  .tab.on::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--gold);}
  .list{padding:8px 16px;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #15171c;cursor:pointer;}
  .row:last-child{border:none;}
  .l{display:flex;flex-direction:column;gap:4px;}
  .sym{font-weight:600;letter-spacing:.5px;}
  .nam{color:var(--dim);font-size:12px;}
  .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .pr{font-weight:600;font-variant-numeric:tabular-nums;}
  .ch{font-size:12px;font-variant-numeric:tabular-nums;}
  .up{color:var(--green);}.down{color:var(--red);}.tier{color:var(--dim);font-size:11px;background:#15171c;padding:2px 6px;border-radius:4px;margin-left:6px;}
  .empty{padding:40px;text-align:center;color:var(--dim);}
  .nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:12px 0;background:#0d0e13;border-top:1px solid #1e2128;z-index:50;}
  .ni{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);font-size:11px;}
  .ni.on{color:var(--gold);}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .mp{background:#101116;width:100%;max-width:360px;border-radius:12px;padding:20px;border:1px solid #1e2128;}
  .mt{font-size:16px;font-weight:600;margin-bottom:16px;color:var(--gold);}
  .mq{display:flex;gap:8px;margin-bottom:16px;}
  .qt{flex:1;background:#0a0b0f;border:1px solid #1e2128;color:#fff;padding:10px;border-radius:6px;text-align:center;}
  .qa{display:flex;gap:8px;margin-bottom:16px;}
  .qb{flex:1;background:#15171c;border:1px solid #1e2128;color:#aaa;padding:8px;border-radius:6px;}
  .est{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;margin-bottom:16px;}
  .est span{color:#fff;font-weight:600;}
  .cb{width:100%;background:var(--gold);color:#000;font-weight:700;padding:12px;border:none;border-radius:6px;font-size:15px;}
  .cb:disabled{opacity:.5;}
  .rt{margin-top:16px;padding-top:16px;border-top:1px solid #1e2128;}
  .rh{color:var(--dim);font-size:12px;margin-bottom:8px;}
  .recent-item{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;}
  .bug{position:fixed;bottom:80px;right:16px;background:var(--gold);color:#000;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:90;box-shadow:0 4px 12px rgba(245,196,81,.3);}
  .dbg{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid var(--gold);padding:12px;font-family:monospace;font-size:11px;color:#0f0;max-height:45vh;overflow-y:auto;z-index:95;display:none;}
  .dbg div{margin:2px 0;}.err{color:var(--red);}.warn{color:#f5c451;}
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#101116;color:#fff;padding:10px 20px;border-radius:6px;z-index:200;border:1px solid #1e2128;display:none;}
  .chart-canvas{width:100%;height:120px;margin:10px 0;}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><div class="logo-icon"></div> AUR证券</div>
  <div class="bal" id="balText">-- AUR</div>
</div>
<div class="tabs">
  <div class="tab on" id="tQuotes">行情</div>
  <div class="tab" id="tHoldings">持仓</div>
  <div class="tab" id="tMe">我的</div>
</div>
<div id="viewQuotes" class="list"></div>
<div id="viewHoldings" class="list" style="display:none;"></div>
<div id="viewMe" class="list" style="display:none;">
  <div class="row"><div class="l"><div class="sym">UID</div><div class="nam" id="meUid">--</div></div></div>
  <div class="row" onclick="logout()" style="color:var(--red);"><div class="l"><div class="sym">退出登录</div></div></div>
</div>
<div class="nav">
  <div class="ni on" id="nQuotes"><div>📈</div><div>行情</div></div>
  <div class="ni" id="nHoldings"><div>📋</div><div>持仓</div></div>
  <div class="ni" id="nMe"><div>👤</div><div>我的</div></div>
</div>
<div class="bug" onclick="document.getElementById('dbg').style.display=document.getElementById('dbg').style.display==='block'?'none':'block'">🐞</div>
<div class="dbg" id="dbg"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal">
  <div class="mp">
    <div class="mt" id="modalTitle">--</div>
    <canvas id="chartCanvas" class="chart-canvas"></canvas>
    <div class="mq"><div class="qt" id="qPrice">--</div><div class="qt" id="qChg">--</div></div>
    <div class="qa"><button class="qb" onclick="setQty(10)">10</button><button class="qb" onclick="setQty(100)">100</button><button class="qb" onclick="setQty(500)">500</button></div>
    <input class="qt" id="qtyInput" type="number" placeholder="数量" style="width:100%;margin-bottom:12px;" oninput="updateEstimate()">
    <div class="est">预估金额: <span id="estimateAmount">0.00 AUR</span></div>
    <button class="cb" id="confirmBtn" onclick="confirmTrade()">买入</button>
    <div class="rt"><div class="rh">近期成交</div><div id="recentTrades"></div></div>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://irnaphjzlwxvohqotvyj.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlybmFwaHp6bHd4dm9ocW90dnlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYwNjAxMzUsImV4cCI6MjA3MTYzNjEzNX0.5hJeD5P5UlnWzOJ1nSUK0IAXZkfT8qJbGQJxqQJxqQ';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { realtime: { params: { eventsPerSecond: 0 } }, auth: { persistSession: false } });
const log=(m,c)=>{var d=new Date(),t=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')+':'+d.getSeconds().toString().padStart(2,'0');document.getElementById('dbg').innerHTML+=`<div class="${c||''}">[${t}] ${m}</div>`;};
const showToast=(m,t)=>{var x=document.getElementById('toast');x.textContent=m;x.style.display='block';x.style.borderColor=t==='ok'?('#22c55e'):('#ef4444');setTimeout(()=>x.style.display='none',2500);};
log('Supabase 初始化(纯HTTP轮询模式，无WS)...');

var myUid=null, stocks=[], holdings=[], currentStock=null, currentTab='buy', pollTimer=null;

(function(){
  var me=localStorage.getItem('aur_me');
  if(!me){location.href='user.html';return;}
  try{myUid=JSON.parse(me).uid||JSON.parse(me).id;}catch(e){myUid=1;}
  log('已登录: uid='+myUid,'warn');

  // 5秒超时封装，防死等
  async function safeQuery(p){return new Promise(r=>{var t=setTimeout(()=>r({data:null,error:{message:'网络超时(5s)'}}),5000);p.then(x=>{clearTimeout(t);r(x);}).catch(e=>{clearTimeout(t);r({data:null,error:e});});});}

  async function verifyBalance(){
    var r=await safeQuery(sb.from('wallets').select('balance').eq('uid',myUid).single());
    if(r.error){log('wallets 失败: '+r.error.message,'err');document.getElementById('balText').textContent='-- AUR';return;}
    document.getElementById('balText').textContent=Number(r.data.balance).toFixed(2)+' AUR';
    log('wallets 余额: '+r.data.balance);
  }

  async function loadStocks(){
    var r=await safeQuery(sb.from('stocks').select('*').order('tier').order('symbol'));
    if(r.error){log('stocks 失败: '+r.error.message,'err');document.getElementById('viewQuotes').innerHTML='<div class="empty">加载失败: '+r.error.message+'</div>';return;}
    stocks=r.data||[]; log('stocks 加载: '+stocks.length+'只');
    var h=''; stocks.forEach(function(s){var c=s.change>=0?'up':'down',ch=s.change>=0?'+':'',ch2=s.change_pct>=0?'+':''; h+=`<div class="row" onclick="openModal('${s.symbol}','buy')"><div class="l"><div class="sym">${s.symbol}<span class="tier">${s.tier||''}</span></div><div class="nam">${s.name}</div></div><div class="r"><div class="pr ${c}">${ch}${s.change||0} (${ch2}${s.change_pct||0}%)</div><div class="ch ${c}">${s.price}</div></div></div>`;});
    document.getElementById('viewQuotes').innerHTML=h||'<div class="empty">没有可显示的股票</div>';
  }

  async function loadHoldings(){
    var r=await safeQuery(sb.from('holdings').select('*').eq('uid',myUid));
    if(r.error){log('holdings 失败: '+r.error.message,'err');document.getElementById('viewHoldings').innerHTML='<div class="empty">加载失败</div>';return;}
    holdings=r.data||[]; log('持仓: '+holdings.length+'只');
    var h=''; holdings.forEach(function(x){var s=stocks.find(function(k){return k.symbol===x.symbol;})||{name:x.symbol,price:x.avg_cost};h+=`<div class="row" onclick="openModal('${x.symbol}','sell')"><div class="l"><div class="sym">${x.symbol}</div><div class="nam">${s.name} · ${x.qty}股</div></div><div class="r"><div class="pr">${s.price}</div><div class="ch dim">成本 ${x.avg_cost}</div></div></div>`;});
    document.getElementById('viewHoldings').innerHTML=h||'<div class="empty">暂无持仓</div>';
  }

  window.openModal=function(sym,tab){currentStock=stocks.find(function(k){return k.symbol===sym;})||{symbol:sym,price:0,name:sym};currentTab=tab;document.getElementById('modalTitle').textContent=currentStock.symbol+' · '+currentStock.name;document.getElementById('qPrice').textContent='价: '+currentStock.price;document.getElementById('qChg').textContent='变: '+(currentStock.change||0);document.getElementById('qtyInput').value='';updateEstimate();drawChart(currentStock);loadRecentTrades(sym);document.getElementById('confirmBtn').textContent=tab==='buy'?'买入':'卖出';document.getElementById('modal').style.display='flex';};
  window.closeModal=function(){document.getElementById('modal').style.display='none';};

  function drawChart(s){var c=document.getElementById('chartCanvas'),x=c.getContext('2d');c.width=c.offsetWidth*2;c.height=c.offsetHeight*2;x.scale(2,2);var w=c.offsetWidth,h=c.offsetHeight;x.clearRect(0,0,w,h);var p=[],b=s.prev_close||s.price;for(var i=0;i<40;i++)p.push(b*0.98+(Math.random()-0.5)*b*0.04+(b*0.98-b)*i/39);p[39]=s.price;var mn=Math.min.apply(null,p),mx=Math.max.apply(null,p),rg=mx-mn||1;x.beginPath();x.moveTo(0,h-(p[0]-mn)/rg*h);for(var i=1;i<40;i++)x.lineTo(i/39*w,h-(p[i]-mn)/rg*h);x.strokeStyle=s.change>=0?'#22c55e':'#ef4444';x.lineWidth=2;x.stroke();x.lineTo(w,h);x.lineTo(0,h);x.closePath();var g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,(s.change>=0?'rgba(34,197,94,':'rgba(239,68,68,')+'0.15)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fill();}
  window.setQty=function(q){document.getElementById('qtyInput').value=q;updateEstimate();};
  window.updateEstimate=function(){if(!currentStock)return;var q=parseFloat(document.getElementById('qtyInput').value)||0;document.getElementById('estimateAmount').textContent=(q*currentStock.price).toFixed(2)+' AUR';};
  function loadRecentTrades(sym){sb.from('stock_trades').select('*').eq('symbol',sym).order('created_at',{ascending:false}).limit(8).then(function(r){var h='';if(r.data&&r.data.length)r.data.forEach(function(t){var b=t.side==='buy';h+=`<div class="recent-item"><span class="${b?'up':'down'}">${b?'买入':'卖出'}</span><span>${t.qty}股 @ ${Number(t.price).toFixed(2)}</span></div>`;});else h='<div style="color:#5a6175;font-size:12px;">无记录</div>';document.getElementById('recentTrades').innerHTML=h;});}
  window.confirmTrade=function(){if(!currentStock)return;var q=parseFloat(document.getElementById('qtyInput').value);if(!q||q<=0){showToast('输数量','err');return;}var btn=document.getElementById('confirmBtn');btn.disabled=true;var args={p_uid:String(myUid),p_symbol:currentStock.symbol,p_qty:q};(currentTab==='buy'?sb.rpc('buy_stock',args):sb.rpc('sell_stock',args)).then(function(res){btn.disabled=false;if(res.error){showToast(res.error.message||'失败','err');return;}var r=res.data;if(r&&r.error){showToast(r.error,'err');return;}showToast(currentTab==='buy'?'买入成功':'卖出成功','ok');closeModal();verifyBalance();loadHoldings();loadStocks();}).catch(function(e){btn.disabled=false;showToast('网络错误','err');});};
  window.logout=function(){localStorage.removeItem('aur_me');location.href='user.html';};

  // 切页
  function showTab(t){['Quotes','Holdings','Me'].forEach(function(x){document.getElementById('view'+x).style.display='none';document.getElementById('t'+x).classList.remove('on');document.getElementById('n'+x).classList.remove('on');});document.getElementById('view'+t).style.display='block';document.getElementById('t'+t).classList.add('on');document.getElementById('n'+t).classList.add('on');if(t==='Me')document.getElementById('meUid').textContent=myUid;}
  document.getElementById('tQuotes').onclick=function(){showTab('Quotes');};
  document.getElementById('tHoldings').onclick=function(){showTab('Holdings');};
  document.getElementById('tMe').onclick=function(){showTab('Me');};
  document.getElementById('nQuotes').onclick=function(){showTab('Quotes');};
  document.getElementById('nHoldings').onclick=function(){showTab('Holdings');};
  document.getElementById('nMe').onclick=function(){showTab('Me');};

  // 首次加载
  verifyBalance(); loadStocks(); loadHoldings();

  // 纯HTTP轮询(代替WebSocket，每5秒，防连坐)
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(function(){if(document.getElementById('viewQuotes').style.display!=='none')loadStocks();if(document.getElementById('viewHoldings').style.display!=='none'){verifyBalance();loadHoldings();}},5000);
  log('启动5秒HTTP轮询(无WS)...');
})();
</script>
</body>
</html>
