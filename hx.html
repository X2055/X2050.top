<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>图片混淆</title>
<style>
:root{
    --ios-blue:#007AFF;
    --ios-purple:#AF52DE;
    --ios-pink:#FF2D55;
    --ios-orange:#FF9500;
    --ios-bg:#f2f2f7;
    --ios-card:#ffffff;
    --ios-text:#1c1c1e;
    --ios-secondary:#6c6c70;
    --shadow:0 8px 30px rgba(0,0,0,.08);
    --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
    margin:0;padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--ios-bg);color:var(--ios-text);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:36px 16px 48px;position:relative;overflow-x:hidden;
    background:
        radial-gradient(900px 520px at 10% -8%, rgba(0,122,255,.11), transparent 60%),
        radial-gradient(820px 480px at 100% 2%, rgba(175,82,222,.11), transparent 60%),
        radial-gradient(720px 440px at 52% 112%, rgba(255,45,85,.08), transparent 60%),
        var(--ios-bg);
}
@keyframes fadeUp{from{opacity:0;transform:translate3d(0,18px,0);}to{opacity:1;transform:translate3d(0,0,0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,122,255,.30);}50%{box-shadow:0 0 0 11px rgba(0,122,255,0);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes shimmer{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
@keyframes floatY{0%,100%{transform:translate3d(0,0,0);}50%{transform:translate3d(0,-4px,0);}}
.header{text-align:center;margin-bottom:22px;animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both;will-change:opacity,transform;}
.header h1{
    font-size:30px;font-weight:800;letter-spacing:.4px;margin:0 0 12px;
    background:linear-gradient(135deg,var(--ios-blue),var(--ios-purple) 55%,var(--ios-pink));
    background-size:200% 200%;animation:shimmer 6s ease infinite;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.header .desc{
    display:inline-block;max-width:460px;font-size:13px;line-height:1.65;
    color:var(--ios-secondary);background:var(--ios-card);
    padding:13px 17px;border-radius:var(--radius);box-shadow:var(--shadow);
    animation:fadeUp .8s .12s cubic-bezier(.2,.7,.2,1) both;will-change:opacity,transform;
}
.card,.preview-wrap,.footer{animation:fadeUp .8s .22s cubic-bezier(.2,.7,.2,1) both;will-change:opacity,transform;}
.card{
    width:100%;max-width:580px;background:var(--ios-card);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:22px 20px;margin-bottom:16px;text-align:center;
    transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s cubic-bezier(.2,.7,.2,1);
    will-change:transform;
}
.card:hover{transform:translate3d(0,-2px,0);box-shadow:0 12px 36px rgba(0,0,0,.10);}
.btn-group{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;}
.normal_button{
    min-width:5.2rem;height:42px;line-height:42px;
    font-size:15px;font-weight:600;padding:0 18px;margin:0 4px;
    border:0;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;
    position:relative;vertical-align:middle;color:#fff;cursor:pointer;user-select:none;
    transition:transform .18s cubic-bezier(.2,.7,.2,1),filter .18s ease,box-shadow .25s ease;
    box-shadow:0 4px 14px rgba(0,0,0,.14);overflow:hidden;
    will-change:transform;
}
.normal_button::after{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%);
    pointer-events:none;
}
.normal_button:hover{filter:brightness(1.06);transform:translate3d(0,-1px,0);box-shadow:0 6px 18px rgba(0,0,0,.16);}
.normal_button:active{transform:scale(.955);filter:brightness(.94);box-shadow:0 2px 8px rgba(0,0,0,.14);transition-duration:.08s;}
.normal_button .ipt_btn{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;padding:0;}
.btn-pick{background:linear-gradient(135deg,#1c1c2e,#2a2a44);}
.btn-enc{background:linear-gradient(135deg,var(--ios-purple),#7a2dd6);}
.btn-dec{background:linear-gradient(135deg,var(--ios-pink),#d9204a);}
.btn-re{background:linear-gradient(135deg,var(--ios-orange),#e6850e);}
.btn-loading{cursor:wait;filter:saturate(.6);}
.btn-loading::before{
    content:"";width:16px;height:16px;margin-right:8px;border-radius:50%;
    border:2.5px solid rgba(255,255,255,.55);border-top-color:#fff;
    animation:spin .8s linear infinite;
}
.preview-wrap{
    width:100%;max-width:580px;background:var(--ios-card);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:14px;display:flex;align-items:center;justify-content:center;min-height:150px;
    transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s cubic-bezier(.2,.7,.2,1);
    will-change:transform;
}
.preview-wrap:hover{transform:translate3d(0,-2px,0);box-shadow:0 12px 36px rgba(0,0,0,.10);}
#display-img{
    max-width:calc(100vw - 60px);max-height:calc(100vh - 280px);
    border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.12);
    opacity:0;transform:scale3d(.985,.985,1);
    transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1);
    will-change:opacity,transform;
}
#display-img.show{opacity:1;transform:scale3d(1,1,1);animation:floatY 5s ease-in-out infinite;}
.footer{margin-top:22px;font-size:12px;color:#8e8e93;text-align:center;animation:fadeIn 1s .4s both;}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--ios-blue);
    background:rgba(0,122,255,.10);padding:4px 10px;border-radius:7px;margin-bottom:14px;
    animation:pulse 2.6s ease infinite;}
.toast{position:fixed;left:50%;bottom:34px;transform:translate3d(-50%,20px,0);
    background:rgba(28,28,30,.92);color:#fff;font-size:13px;font-weight:500;
    padding:10px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);
    opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s cubic-bezier(.2,.7,.2,1);z-index:99;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);will-change:opacity,transform;}
.toast.show{opacity:1;transform:translate3d(-50%,0,0);}
</style>
</head>
<body>
<div class="header">
    <h1>X2050.TOP</h1>
    <div class="desc">温馨提示: 请勿使用本工具对抗审查，请在保证文件合法合规的情况下使用！</div>
</div>

<div class="card">
    <div><span class="tag">操作面板</span></div>
    <div class="btn-group">
        <button class="normal_button btn-pick">选择图片<input type="file" accept="image/*" id="ipt" class="ipt_btn" /></button>
        <button id="enc" class="normal_button btn-enc">混淆</button>
        <button id="dec" class="normal_button btn-dec">解混淆</button>
        <button id="re" class="normal_button btn-re">还原</button>
    </div>
</div>

<div class="preview-wrap">
    <img id="display-img" alt="预览" style="display:none;" />
</div>

<div class="footer">x2050.top</div>
<div id="toast" class="toast"></div>

<script>
/* ===== Gilbert 空间填充曲线（与源文件逐字一致）===== */
function gilbert2d(width, height) {
    const coordinates = [];
    if (width >= height) generate2d(0, 0, width, 0, 0, height, coordinates);
    else generate2d(0, 0, 0, height, width, 0, coordinates);
    return coordinates;
}
function generate2d(x, y, ax, ay, bx, by, coordinates) {
    const w = Math.abs(ax + ay), h = Math.abs(bx + by);
    const dax = Math.sign(ax), day = Math.sign(ay);
    const dbx = Math.sign(bx), dby = Math.sign(by);
    if (h === 1) { for (let i = 0; i < w; i++) { coordinates.push([x, y]); x += dax; y += day; } return; }
    if (w === 1) { for (let i = 0; i < h; i++) { coordinates.push([x, y]); x += dbx; y += dby; } return; }
    let ax2 = Math.floor(ax / 2), ay2 = Math.floor(ay / 2);
    let bx2 = Math.floor(bx / 2), by2 = Math.floor(by / 2);
    const w2 = Math.abs(ax2 + ay2), h2 = Math.abs(bx2 + by2);
    if (2 * w > 3 * h) {
        if ((w2 % 2) && (w > 2)) { ax2 += dax; ay2 += day; }
        generate2d(x, y, ax2, ay2, bx, by, coordinates);
        generate2d(x + ax2, y + ay2, ax - ax2, ay - ay2, bx, by, coordinates);
    } else {
        if ((h2 % 2) && (h > 2)) { bx2 += dbx; by2 += dby; }
        generate2d(x, y, bx2, by2, ax2, ay2, coordinates);
        generate2d(x + bx2, y + by2, ax, ay, bx - bx2, by - by2, coordinates);
        generate2d(x + (ax - dax) + (bx2 - dbx), y + (ay - day) + (by2 - dby),
            -bx2, -by2, -(ax - ax2), -(ay - ay2), coordinates);
    }
}
</script>
<script>
/* ===== 业务逻辑（与源文件一致；修复：等待图片解码确保尺寸有效）===== */
const img = document.getElementById("display-img");
const toast = document.getElementById("toast");
let toastTimer;
function showToast(msg){
    toast.textContent = msg; toast.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>toast.classList.remove("show"), 1800);
}
function setLoading(btn, loading, text){
    if(!btn) return;
    if(loading){ btn.dataset.label = btn.textContent; btn.classList.add("btn-loading"); btn.textContent = text; btn.disabled = true; }
    else { btn.classList.remove("btn-loading"); btn.textContent = btn.dataset.label || text; btn.disabled = false; }
}
function setsrc(src){
    if(img.src) URL.revokeObjectURL(img.src);
    img.src = src;
    img.style.display = "inline-block";
    // 等待图片解码完成再显示，确保后续 encrypt/decrypt 能拿到正确 width/height
    if(img.decode){ img.decode().catch(()=>{}).then(()=>{ requestAnimationFrame(()=>img.classList.add("show")); }); }
    else { requestAnimationFrame(()=>img.classList.add("show")); }
}
function encrypt(imgEl){
    const cvs = document.createElement("canvas");
    const width = cvs.width = imgEl.width, height = cvs.height = imgEl.height;
    const ctx = cvs.getContext("2d"); ctx.drawImage(imgEl, 0, 0);
    const imgdata = ctx.getImageData(0, 0, width, height);
    const imgdata2 = new ImageData(width, height);
    const curve = gilbert2d(width, height);
    const offset = Math.round((Math.sqrt(5) - 1) / 2 * width * height);
    for(let i = 0; i < width * height; i++){
        const old_pos = curve[i], new_pos = curve[(i + offset) % (width * height)];
        const old_p = 4 * (old_pos[0] + old_pos[1] * width);
        const new_p = 4 * (new_pos[0] + new_pos[1] * width);
        imgdata2.data.set(imgdata.data.slice(old_p, old_p + 4), new_p);
    }
    ctx.putImageData(imgdata2, 0, 0);
    cvs.toBlob(b => { setsrc(URL.createObjectURL(b)); }, "image/jpeg", 0.95);
}
function decrypt(imgEl){
    const cvs = document.createElement("canvas");
    const width = cvs.width = imgEl.width, height = cvs.height = imgEl.height;
    const ctx = cvs.getContext("2d"); ctx.drawImage(imgEl, 0, 0);
    const imgdata = ctx.getImageData(0, 0, width, height);
    const imgdata2 = new ImageData(width, height);
    const curve = gilbert2d(width, height);
    const offset = Math.round((Math.sqrt(5) - 1) / 2 * width * height);
    for(let i = 0; i < width * height; i++){
        const old_pos = curve[i], new_pos = curve[(i + offset) % (width * height)];
        const old_p = 4 * (old_pos[0] + old_pos[1] * width);
        const new_p = 4 * (new_pos[0] + new_pos[1] * width);
        imgdata2.data.set(imgdata.data.slice(new_p, new_p + 4), old_p);
    }
    ctx.putImageData(imgdata2, 0, 0);
    cvs.toBlob(b => { setsrc(URL.createObjectURL(b)); }, "image/jpeg", 0.95);
}
const ipt = document.getElementById("ipt");
ipt.onchange = () => {
    if(ipt.files.length > 0){ setsrc(URL.createObjectURL(ipt.files[0])); showToast("已加载图片"); }
};
function runWithFade(btn, loadingText, doneText, fn){
    if(!img.src || img.src.endsWith("/")){ showToast("请先选择图片"); return; }
    setLoading(btn, true, loadingText);
    img.classList.remove("show");
    img.style.display = "none";
    const onFade = () => {
        fn();
        setLoading(btn, false);
        showToast(doneText);
    };
    requestAnimationFrame(()=>requestAnimationFrame(()=>requestAnimationFrame(onFade)));
}
const btn_enc = document.getElementById("enc");
btn_enc.onclick = () => runWithFade(btn_enc, "混淆中", "混淆完成", ()=>encrypt(img));
const btn_dec = document.getElementById("dec");
btn_dec.onclick = () => runWithFade(btn_dec, "解混淆中", "解混淆完成", ()=>decrypt(img));
const btn_restore = document.getElementById("re");
btn_restore.onclick = () => {
    if(ipt.files.length > 0){ setsrc(URL.createObjectURL(ipt.files[0])); showToast("已还原"); }
};
</script>
</body>
</html>
