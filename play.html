<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f2f2f7">
<title>Aurum Casino</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
  background: #f2f2f7; color: #1c1c1e;
  padding-bottom: calc(70px + env(safe-area-inset-bottom));
}
button { font-family: inherit; cursor: pointer; border: none; outline: none; }

.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255,255,255,0.85); backdrop-filter: blur(20px);
  padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(0,0,0,0.06);
}
.topbar .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
.topbar .balance { font-size: 14px; color: #8e8e93; }

.tabs { display: flex; gap: 8px; padding: 12px 16px; }
.tab {
  flex: 1; padding: 10px 0; border-radius: 12px;
  background: #e5e5ea; color: #8e8e93; font-size: 14px; font-weight: 600;
  transition: all .2s;
}
.tab.active { background: #007aff; color: #fff; }

.game-view { display: none; padding: 0 16px; }
.game-view.active { display: block; }

.card {
  background: #fff; border-radius: 20px; padding: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.04); margin-bottom: 12px;
}

.slot-machine { text-align: center; }
.slot-reels { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
.reel {
  width: 80px; height: 80px; background: #f8f8f8; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.06);
}
.slot-btn {
  width: 100%; padding: 16px; border-radius: 16px;
  background: linear-gradient(135deg, #007aff, #0051d5); color: #fff;
  font-size: 17px; font-weight: 700; margin-top: 12px;
}
.slot-btn:active { transform: scale(.97); }
.slot-btn:disabled { opacity: .6; }

.dice-area { text-align: center; }
.dice-result { display: flex; justify-content: center; gap: 16px; margin: 24px 0; }
.die {
  width: 64px; height: 64px; background: #fff; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08); font-size: 28px; font-weight: 700;
}
.bet-options { display: flex; gap: 10px; margin-top: 16px; }
.bet-btn {
  flex: 1; padding: 14px 0; border-radius: 14px;
  background: #f2f2f7; color: #1c1c1e; font-size: 15px; font-weight: 600;
}
.bet-btn.active { background: #007aff; color: #fff; }
.bet-btn:active { transform: scale(.95); }

.baccarat-area { text-align: center; }
.cards-row { display: flex; justify-content: center; gap: 30px; margin: 20px 0; }
.card-group { text-align: center; }
.card-group .label { font-size: 12px; color: #8e8e93; margin-bottom: 8px; }
.bacc-cards { display: flex; gap: 6px; }
.bacc-card {
  width: 50px; height: 70px; background: #fff; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; color: #1c1c1e;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.bet-input {
  width: 100%; padding: 14px 16px; border-radius: 14px;
  border: 1.5px solid #e5e5ea; background: #fafafa;
  font-size: 16px; margin: 12px 0; outline: none;
}
.bet-input:focus { border-color: #007aff; }

.result-text { text-align: center; font-size: 15px; margin-top: 12px; min-height: 22px; }
.result-text.win { color: #34c759; font-weight: 600; }
.result-text.lose { color: #ff3b30; font-weight: 600; }

#toast {
  position: fixed; top: calc(20px + env(safe-area-inset-top)); left: 50%;
  transform: translate(-50%, -150px); z-index: 200;
  background: rgba(0,0,0,0.82); color: #fff; padding: 12px 20px;
  border-radius: 14px; font-size: 14px; font-weight: 500;
  transition: transform .35s cubic-bezier(.2,.8,.2,1); pointer-events: none;
  max-width: 80%; text-align: center;
}
#toast.show { transform: translate(-50%, 0); }
#toast.err { background: #ff3b30; }

.bottomtab {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  background: rgba(255,255,255,0.9); backdrop-filter: blur(20px);
  border-top: 1px solid rgba(0,0,0,0.06);
  display: flex; padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
}
.bottomtab a {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  text-decoration: none; color: #8e8e93; font-size: 10px; font-weight: 500;
}
.bottomtab a.active { color: #007aff; }
</style>
</head>
<body>

<div id="toast"></div>

<header class="topbar">
  <div class="logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="4" fill="#007aff"/><path d="M7 14l2-4 2 3 2-5 4 6H7z" fill="#fff"/></svg>
    Aurum Casino
  </div>
  <div class="balance" id="balanceText">验证中...</div>
</header>

<div class="tabs">
  <button class="tab active" data-game="slot">🎰 老虎机</button>
  <button class="tab" data-game="sicbo">🎲 骰宝</button>
  <button class="tab" data-game="baccarat">🃏 百家乐</button>
</div>

<div class="game-view active" id="view-slot">
  <div class="card slot-machine">
    <div class="slot-reels">
      <div class="reel" id="reel1">🍒</div>
      <div class="reel" id="reel2">🍒</div>
      <div class="reel" id="reel3">🍒</div>
    </div>
    <input class="bet-input" id="slotBet" type="number" step="50" min="50" value="50" placeholder="投注金额 (50 AUR)">
    <button class="slot-btn" id="slotBtn">🎰 开始旋转</button>
    <div class="result-text" id="slotResult"></div>
  </div>
</div>

<div class="game-view" id="view-sicbo">
  <div class="card dice-area">
    <div class="dice-result" id="diceResult">
      <div class="die">?</div>
      <div class="die">?</div>
      <div class="die">?</div>
    </div>
    <div class="bet-options">
      <button class="bet-btn active" data-bet="big">大 (≥11)</button>
      <button class="bet-btn" data-bet="small">小 (≤10)</button>
      <button class="bet-btn" data-bet="triple">三连 (24x)</button>
    </div>
    <input class="bet-input" id="sicboBet" type="number" step="100" min="100" value="100" placeholder="投注金额 (100 AUR)">
    <button class="slot-btn" id="sicboBtn" style="background:linear-gradient(135deg,#ff9500,#ed6c02);">🎲 掷骰子</button>
    <div class="result-text" id="sicboResult"></div>
  </div>
</div>

<div class="game-view" id="view-baccarat">
  <div class="card baccarat-area">
    <div class="cards-row">
      <div class="card-group">
        <div class="label">庄</div>
        <div class="bacc-cards" id="bankerCards">
          <div class="bacc-card">?</div>
          <div class="bacc-card">?</div>
        </div>
      </div>
      <div class="card-group">
        <div class="label">闲</div>
        <div class="bacc-cards" id="playerCards">
          <div class="bacc-card">?</div>
          <div class="bacc-card">?</div>
        </div>
      </div>
    </div>
    <div class="bet-options">
      <button class="bet-btn active" data-bet="banker">庄</button>
      <button class="bet-btn" data-bet="player">闲</button>
    </div>
    <input class="bet-input" id="baccaratBet" type="number" step="200" min="200" value="200" placeholder="投注金额 (200 AUR)">
    <button class="slot-btn" id="baccaratBtn" style="background:linear-gradient(135deg,#34c759,#248a3d);">🃏 发牌</button>
    <div class="result-text" id="baccaratResult"></div>
  </div>
</div>

<nav class="bottomtab">
  <a href="user.html">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1v-9.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>主页</span>
  </a>
  <a href="shop.html">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4H6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M3 6h18M16 10a4 4 0 01-8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>商城</span>
  </a>
  <a href="#" class="active">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>娱乐</span>
  </a>
</nav>

<script>
(function(){
  var SUPABASE_URL = 'https://irnaphrjcdfmqyykdron.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlybmFwaHJqY2RmbXF5eWtkcm9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDUzNzIsImV4cCI6MjEwMzI4MTM3Mn0.4FNlvN4GfVSmYQTr2ZelAc96EavUohqbLURirbeIUlI';

  function showToast(msg, isErr) {
    var t = document.getElementById('toast'); t.textContent = msg;
    t.classList.toggle('err', !!isErr); t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 3000);
  }

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var me = null;

  try { var c = localStorage.getItem('aur_me'); if(c) me = JSON.parse(c); } catch(e) {}

  if(!me) {
    showToast('请先在主站登录', true);
    setTimeout(function(){ location.href = 'user.html'; }, 1500);
    return;
  }

  var myUid = Number(me.uid);

  // 页面加载立即验证钱包是否存在
  function verifySession(callback) {
    sb.from('wallets').select('balance').eq('uid', myUid).single().then(function(r){
      if(!r.data) {
        showToast('登录已过期，请重新登录', true);
        localStorage.removeItem('aur_me');
        setTimeout(function(){ location.href = 'user.html'; }, 1500);
        return;
      }
      me.balance = r.data.balance;
      try { localStorage.setItem('aur_me', JSON.stringify(me)); } catch(e){}
      document.getElementById('balanceText').textContent = Number(me.balance||0).toFixed(2) + ' AUR';
      if(callback) callback();
    }).catch(function(){
      showToast('登录已过期，请重新登录', true);
      localStorage.removeItem('aur_me');
      setTimeout(function(){ location.href = 'user.html'; }, 1500);
    });
  }

  verifySession();

  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      var game = tab.dataset.game;
      document.querySelectorAll('.game-view').forEach(function(v){ v.classList.remove('active'); });
      document.getElementById('view-' + game).classList.add('active');
    });
  });

  var sicboChoice = 'big';
  document.querySelectorAll('#view-sicbo .bet-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('#view-sicbo .bet-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      sicboChoice = btn.dataset.bet;
    });
  });

  var baccaratChoice = 'banker';
  document.querySelectorAll('#view-baccarat .bet-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('#view-baccarat .bet-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      baccaratChoice = btn.dataset.bet;
    });
  });

  // 老虎机
  document.getElementById('slotBtn').addEventListener('click', function(){
    var btn = this;
    var bet = parseFloat(document.getElementById('slotBet').value);
    if(!bet || bet < 50) return showToast('最低投注 50 AUR', true);
    if(bet > Number(me.balance||0)) return showToast('余额不足', true);
    btn.disabled = true; btn.textContent = '旋转中...';

    var reels = [document.getElementById('reel1'), document.getElementById('reel2'), document.getElementById('reel3')];
    var symbols = ['🍒','🍋','🔔','💎','🍒'];
    var interval = setInterval(function(){
      reels.forEach(function(r){ r.textContent = symbols[Math.floor(Math.random()*5)]; });
    }, 80);

    sb.rpc('play_slot', { p_uid: myUid, p_bet: bet }).then(function(res){
      clearInterval(interval);
      var r = res.data;
      if(!r) { showToast('服务器无响应', true); btn.disabled = false; btn.textContent = '🎰 开始旋转'; return; }
      if(!r.ok) {
        var errMsg = r.err || '游戏失败';
        showToast(errMsg, true);
        if(errMsg.indexOf('登录') > -1 || errMsg.indexOf('钱包') > -1 || errMsg.indexOf('过期') > -1) {
          localStorage.removeItem('aur_me');
          setTimeout(function(){ location.href = 'user.html'; }, 1500);
        }
        btn.disabled = false; btn.textContent = '🎰 开始旋转'; return;
      }
      var result = r.reels;
      setTimeout(function(){
        reels[0].textContent = result[0]; reels[1].textContent = result[1]; reels[2].textContent = result[2];
        var resultEl = document.getElementById('slotResult');
        if(r.payout > 0) {
          resultEl.textContent = '赢得 ' + r.payout + ' AUR！';
          resultEl.className = 'result-text win';
        } else {
          resultEl.textContent = '未中奖，再试一次';
          resultEl.className = 'result-text lose';
        }
        verifySession();
        btn.disabled = false; btn.textContent = '🎰 开始旋转';
      }, 600);
    }).catch(function(e){
      clearInterval(interval);
      showToast('网络错误，请重试', true);
      btn.disabled = false; btn.textContent = '🎰 开始旋转';
    });
  });

  // 骰宝
  document.getElementById('sicboBtn').addEventListener('click', function(){
    var btn = this;
    var bet = parseFloat(document.getElementById('sicboBet').value);
    if(!bet || bet < 100) return showToast('最低投注 100 AUR', true);
    if(bet > Number(me.balance||0)) return showToast('余额不足', true);
    btn.disabled = true; btn.textContent = '掷骰子中...';

    sb.rpc('play_sicbo', { p_uid: myUid, p_bet: bet, p_choice: sicboChoice }).then(function(res){
      var r = res.data;
      if(!r) { showToast('服务器无响应', true); btn.disabled = false; btn.textContent = '🎲 掷骰子'; return; }
      if(!r.ok) {
        var errMsg = r.err || '游戏失败';
        showToast(errMsg, true);
        if(errMsg.indexOf('登录') > -1 || errMsg.indexOf('钱包') > -1 || errMsg.indexOf('过期') > -1) {
          localStorage.removeItem('aur_me');
          setTimeout(function(){ location.href = 'user.html'; }, 1500);
        }
        btn.disabled = false; btn.textContent = '🎲 掷骰子'; return;
      }
      var dice = r.dice;
      var html = '';
      dice.forEach(function(d){ html += '<div class="die">' + d + '</div>'; });
      document.getElementById('diceResult').innerHTML = html;
      var resultEl = document.getElementById('sicboResult');
      if(r.payout > 0) {
        resultEl.textContent = '总和 ' + r.total + '，赢得 ' + r.payout + ' AUR！';
        resultEl.className = 'result-text win';
      } else {
        resultEl.textContent = '总和 ' + r.total + '，未中奖';
        resultEl.className = 'result-text lose';
      }
      verifySession();
      btn.disabled = false; btn.textContent = '🎲 掷骰子';
    }).catch(function(e){
      showToast('网络错误，请重试', true);
      btn.disabled = false; btn.textContent = '🎲 掷骰子';
    });
  });

  // 百家乐
  document.getElementById('baccaratBtn').addEventListener('click', function(){
    var btn = this;
    var bet = parseFloat(document.getElementById('baccaratBet').value);
    if(!bet || bet < 200) return showToast('最低投注 200 AUR', true);
    if(bet > Number(me.balance||0)) return showToast('余额不足', true);
    btn.disabled = true; btn.textContent = '发牌中...';

    sb.rpc('play_baccarat', { p_uid: myUid, p_bet: bet, p_choice: baccaratChoice }).then(function(res){
      var r = res.data;
      if(!r) { showToast('服务器无响应', true); btn.disabled = false; btn.textContent = '🃏 发牌'; return; }
      if(!r.ok) {
        var errMsg = r.err || '游戏失败';
        showToast(errMsg, true);
        if(errMsg.indexOf('登录') > -1 || errMsg.indexOf('钱包') > -1 || errMsg.indexOf('过期') > -1) {
          localStorage.removeItem('aur_me');
          setTimeout(function(){ location.href = 'user.html'; }, 1500);
        }
        btn.disabled = false; btn.textContent = '🃏 发牌'; return;
      }
      function renderCards(containerId, cards) {
        var html = '';
        cards.forEach(function(c){ html += '<div class="bacc-card">' + c + '</div>'; });
        document.getElementById(containerId).innerHTML = html;
      }
      renderCards('bankerCards', r.banker);
      renderCards('playerCards', r.player);
      var resultEl = document.getElementById('baccaratResult');
      if(r.payout > 0) {
        resultEl.textContent = '庄 ' + r.banker.join('+') + ' vs 闲 ' + r.player.join('+') + '，赢得 ' + r.payout + ' AUR！';
        resultEl.className = 'result-text win';
      } else {
        resultEl.textContent = '庄 ' + r.banker.join('+') + ' vs 闲 ' + r.player.join('+') + '，未中奖';
        resultEl.className = 'result-text lose';
      }
      verifySession();
      btn.disabled = false; btn.textContent = '🃏 发牌';
    }).catch(function(e){
      showToast('网络错误，请重试', true);
      btn.disabled = false; btn.textContent = '🃏 发牌';
    });
  });
})();
</script>
</body>
</html>
