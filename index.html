<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>2050主页</title>
  <style>
    /* ==========================================
       
       ========================================== */
    :root {
      --bg-color: #f2f2f7;
      --card-bg: rgba(255, 255, 255, 0.8);
      --text-main: #000000;
      --text-sub: #8e8e93;
      --accent-color: #007aff;
      --modal-bg: rgba(255, 255, 255, 0.88);
      --modal-overlay: rgba(0, 0, 0, 0.35);
      --border-color: rgba(60, 60, 67, 0.18);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --icon-shadow: 0 4px 12px rgba(0, 0, 0, 0.12);
      --blur-val: blur(25px) saturate(180%);
    }

    [data-theme="dark"] {
      --bg-color: #000000;
      --card-bg: rgba(28, 28, 30, 0.8);
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --accent-color: #0a84ff;
      --modal-bg: rgba(30, 30, 32, 0.88);
      --modal-overlay: rgba(0, 0, 0, 0.65);
      --border-color: rgba(84, 84, 88, 0.35);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      --icon-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* ==========================================
       顶部导航栏 & 日夜插画风切换开关
       ========================================== */
    .header-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 12px 24px;
      backdrop-filter: var(--blur-val);
      -webkit-backdrop-filter: var(--blur-val);
      background-color: var(--card-bg);
      border-bottom: 0.5px solid var(--border-color);
    }

    /* 开关基础控件 */
    .theme-switch {
      position: relative;
      display: inline-block;
      width: 68px;
      height: 34px;
      cursor: pointer;
    }

    .theme-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    /* 轨道背景 - 默认白天 */
    .switch-track {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, #70a1ff 0%, #a8c0ff 100%);
      border-radius: 30px;
      transition: background 0.4s ease;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 2px 6px rgba(0,0,0,0.1);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
    }

    /* 滑块基础 - 默认太阳 */
    .switch-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: #eccc68;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2), 0 0 8px #ffa502;
      transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55), background 0.4s ease, box-shadow 0.4s ease;
      z-index: 2;
    }

    /* 月亮陨石坑 */
    .crater {
      position: absolute;
      background: #a4b0be;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .crater-1 { top: 5px; left: 11px; width: 6px; height: 6px; }
    .crater-2 { top: 13px; left: 5px; width: 7px; height: 7px; }
    .crater-3 { top: 14px; left: 14px; width: 4px; height: 4px; }

    /* 背景元素：云朵与星星 */
    .cloud {
      position: absolute;
      background: #ffffff;
      border-radius: 10px;
      opacity: 0.9;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .cloud-1 { right: 6px; top: 15px; width: 24px; height: 12px; border-radius: 8px; }
    .cloud-2 { right: 18px; top: 8px; width: 16px; height: 10px; border-radius: 8px; }

    .star {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .star-1 { left: 10px; top: 8px; width: 3px; height: 3px; box-shadow: 0 0 3px #fff; }
    .star-2 { left: 22px; top: 18px; width: 2px; height: 2px; }
    .star-3 { left: 32px; top: 7px; width: 3px; height: 3px; box-shadow: 0 0 3px #fff; }

    /* 暗黑模式切换触发样式 */
    [data-theme="dark"] .switch-track {
      background: linear-gradient(180deg, #1e272e 0%, #2f3542 100%);
      border-color: rgba(255, 255, 255, 0.15);
    }

    [data-theme="dark"] .switch-thumb {
      transform: translateX(33px);
      background: #dcdde1;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4), inset -2px -1px 2px rgba(0,0,0,0.2);
    }

    [data-theme="dark"] .crater {
      opacity: 1;
    }

    [data-theme="dark"] .cloud {
      opacity: 0;
      transform: translateY(10px);
    }

    [data-theme="dark"] .star {
      opacity: 1;
      transform: translateY(0);
    }

    /* ==========================================
       主内容区域
       ========================================== */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .main-title {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 24px 0 16px 0;
    }

    /* ==========================================
       轮播图样式
       ========================================== */
    .carousel-container {
      position: relative;
      width: 100%;
      height: 220px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
      margin-bottom: 32px;
    }

    .carousel-track {
      display: flex;
      width: 300%;
      height: 100%;
      transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .slide {
      width: 33.333%;
      height: 100%;
      display: block;
      position: relative;
      text-decoration: none;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .slide-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 16px;
      background: linear-gradient(transparent, rgba(0,0,0,0.6));
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
    }

    .carousel-dots {
      position: absolute;
      bottom: 12px;
      right: 16px;
      display: flex;
      gap: 6px;
      z-index: 10;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transition: all 0.3s ease;
    }

    .dot.active {
      background: #ffffff;
      width: 20px;
      border-radius: 4px;
    }

    /* ==========================================
       iOS App 图标网格
       ========================================== */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 20px 16px;
      justify-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      width: 72px;
      transition: transform 0.2s ease;
    }

    .nav-item:active {
      transform: scale(0.88);
    }

    .icon-box {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background: var(--card-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      box-shadow: var(--icon-shadow);
      margin-bottom: 8px;
      border: 0.5px solid var(--border-color);
      overflow: hidden;
      position: relative;
    }

    .icon-title {
      font-size: 12px;
      color: var(--text-main);
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 400;
    }

    /* ==========================================
       iOS 风格 Alert 弹窗
       ========================================== */
    .ios-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--modal-overlay);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .ios-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .ios-modal {
      width: 270px;
      background: var(--modal-bg);
      backdrop-filter: var(--blur-val);
      -webkit-backdrop-filter: var(--blur-val);
      border-radius: 14px;
      text-align: center;
      overflow: hidden;
      transform: scale(1.15);
      transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
      box-shadow: var(--shadow);
      border: 0.5px solid var(--border-color);
    }

    .ios-modal-overlay.active .ios-modal {
      transform: scale(1);
    }

    .ios-modal-content {
      padding: 20px 16px 16px 16px;
    }

    .ios-modal-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .ios-modal-body {
      font-size: 13px;
      color: var(--text-main);
      line-height: 1.4;
    }

    .ios-modal-actions {
      border-top: 0.5px solid var(--border-color);
      display: flex;
    }

    .ios-modal-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 0;
      font-size: 17px;
      color: var(--accent-color);
      font-weight: 600;
      cursor: pointer;
    }

    .ios-modal-btn:active {
      background-color: rgba(120, 120, 128, 0.1);
    }
  </style>
</head>
<body>

  <!-- 顶部栏 -->
  <header class="header-bar">
    <!-- 日夜模式动画切换开关 -->
    <label class="theme-switch" for="themeToggle">
      <input type="checkbox" id="themeToggle">
      <div class="switch-track">
        <!-- 太阳 / 月亮 -->
        <div class="switch-thumb">
          <span class="crater crater-1"></span>
          <span class="crater crater-2"></span>
          <span class="crater crater-3"></span>
        </div>
        <!-- 装饰背景（星星与云朵） -->
        <span class="star star-1"></span>
        <span class="star star-2"></span>
        <span class="star star-3"></span>
        <span class="cloud cloud-1"></span>
        <span class="cloud cloud-2"></span>
      </div>
    </label>
  </header>

  <div class="container">
    <h1 class="main-title">应用导航</h1>

    <!-- 三张图轮播 -->
    <div class="carousel-container">
      <div class="carousel-track" id="carouselTrack">
        <a href="https://www.apple.com" target="_blank" class="slide">
          <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=800&q=80" alt="Slide 1">
          <div class="slide-caption">探索苹果新品与极致设计</div>
        </a>
        <a href="https://unsplash.com" target="_blank" class="slide">
          <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" alt="Slide 2">
          <div class="slide-caption">寻找高质量超清壁纸灵感</div>
        </a>
        <a href="https://github.com" target="_blank" class="slide">
          <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80" alt="Slide 3">
          <div class="slide-caption">极简IOS风格组件开发</div>
        </a>
      </div>
      <div class="carousel-dots" id="carouselDots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <!-- 图标网格区域 -->
    <div class="nav-grid" id="navGrid"></div>
  </div>

  <!-- iOS 原生风格 Alert 弹窗 -->
  <div class="ios-modal-overlay" id="iosModalOverlay">
    <div class="ios-modal">
      <div class="ios-modal-content">
        <div class="ios-modal-title">德意志万岁</div>
        <div class="ios-modal-body">
          这是一个X2050.top网站的预置页面，版本0.1.1,作者Gator
        </div>
      </div>
      <div class="ios-modal-actions">
        <button class="ios-modal-btn" onclick="closeIosModal()">确定</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       20个图标小方块控制配置 (visible: true 开启 / false 隐藏)
       ========================================================================== */
    const navItemsConfig = [
      { id: 1,  title: "Safari",    icon: "🧭", url: "https://www.apple.com/safari/", visible: true },
      { id: 2,  title: "相册",      icon: "🖼️", url: "#", visible: true },
      { id: 3,  title: "音乐",      icon: "🎵", url: "#", visible: true },
      { id: 4,  title: "天气",      icon: "☀️", url: "#", visible: true },
      { id: 5,  title: "设置",      icon: "⚙️", url: "#", visible: true },
      { id: 6,  title: "邮件",      icon: "✉️", url: "#", visible: true },
      { id: 7,  title: "地图",      icon: "🗺️", url: "#", visible: true },
      { id: 8,  title: "日历",      icon: "📅", url: "#", visible: true },
      { id: 9,  title: "备忘录",    icon: "📝", url: "#", visible: true },
      { id: 10, title: "提醒事项",  icon: "☑️", url: "#", visible: true },
      { id: 11, title: "股市",      icon: "📈", url: "#", visible: true },
      { id: 12, title: "图书",      icon: "📚", url: "#", visible: true },
      { id: 13, title: "播客",      icon: "🎙️", url: "#", visible: false },
      { id: 14, title: "钱包",      icon: "👛", url: "#", visible: true },
      { id: 15, title: "健康",      icon: "❤️", url: "#", visible: true },
      { id: 16, title: "快捷指令",  icon: "⚡", url: "#", visible: true },
      { id: 17, title: "文件",      icon: "📁", url: "#", visible: false },
      { id: 18, title: "翻译",      icon: "🌐", url: "#", visible: true },
      { id: 19, title: "计算器",    icon: "🔢", url: "#", visible: true },
      { id: 20, title: "App Store", icon: "🅰️", url: "#", visible: true }
    ];

    function renderNavGrid() {
      const gridContainer = document.getElementById("navGrid");
      gridContainer.innerHTML = "";

      navItemsConfig.forEach(item => {
        if (item.visible) {
          const a = document.createElement("a");
          a.href = item.url;
          a.className = "nav-item";
          a.target = "_blank";
          a.innerHTML = `
            <div class="icon-box">${item.icon}</div>
            <div class="icon-title">${item.title}</div>
          `;
          gridContainer.appendChild(a);
        }
      });
    }

    /* ==========================================================================
       页面初始化与 iOS 弹窗控制
       ========================================================================== */
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        document.getElementById("iosModalOverlay").classList.add("active");
      }, 300);

      renderNavGrid();
    });

    function closeIosModal() {
      document.getElementById("iosModalOverlay").classList.remove("active");
    }

    /* ==========================================================================
       日夜模式切换开关逻辑
       ========================================================================== */
    const themeToggle = document.getElementById("themeToggle");

    themeToggle.addEventListener("change", (e) => {
      if (e.target.checked) {
        document.documentElement.setAttribute("data-theme", "dark");
      } else {
        document.documentElement.removeAttribute("data-theme");
      }
    });

    /* ==========================================================================
       轮播图自动播放逻辑
       ========================================================================== */
    let currentSlide = 0;
    const track = document.getElementById("carouselTrack");
    const dots = document.querySelectorAll(".dot");
    const totalSlides = 3;

    function goToSlide(index) {
      currentSlide = index;
      track.style.transform = `translateX(-${(100 / totalSlides) * currentSlide}%)`;
      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === currentSlide);
      });
    }

    setInterval(() => {
      currentSlide = (currentSlide + 1) % totalSlides;
      goToSlide(currentSlide);
    }, 3500);

    dots.forEach((dot, index) => {
      dot.addEventListener("click", () => goToSlide(index));
    });
  </script>
</body>
</html>
