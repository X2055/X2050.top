<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刘产 · 刘欣悦书法作品集</title>
<style>
    /* ============ 宣纸底色 ============ */
    @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+QingKe+HuangYou&family=Noto+Serif+SC:wght@400;600;900&display=swap');

    :root{
        --ink:#1a1a1a;
        --ink-light:#3d3835;
        --cinnabar:#a32b1c;   /* 朱砂印泥 */
        --gold:#a8864d;
        --paper:#f3ecdd;
        --paper-dark:#e6dcc4;
    }

    *{margin:0;padding:0;box-sizing:border-box;}

    body{
        background-color:var(--paper);
        background-image:
            radial-gradient(circle at 20% 15%, rgba(120,100,70,.10) 0, transparent 45%),
            radial-gradient(circle at 85% 70%, rgba(120,100,70,.12) 0, transparent 50%),
            repeating-linear-gradient(0deg, rgba(160,140,105,.05) 0 1px, transparent 1px 4px);
        color:var(--ink);
        font-family:"Noto Serif SC","STSong","SimSun",serif;
        min-height:100vh;
        position:relative;
        overflow-x:hidden;
    }

    /* 宣纸边缘暗角 */
    body::before{
        content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
        box-shadow:inset 0 0 160px 40px rgba(110,90,60,.30);
    }

    /* ============ 顶栏 ============ */
    header{
        position:relative;z-index:2;
        text-align:center;
        padding:60px 20px 30px;
        border-bottom:2px double var(--gold);
        margin:0 6vw;
    }
    .studio-name{
        font-family:"ZCOOL QingKe HuangYou",serif;
        letter-spacing:14px;
        font-size:22px;
        color:var(--cinnabar);
        margin-bottom:18px;
    }
    .master-name{
        font-family:"Ma Shan Zheng",cursive;
        font-size:clamp(56px,12vw,130px);
        letter-spacing:6px;
        line-height:1;
        text-shadow:3px 3px 0 rgba(0,0,0,.08);
        position:relative;
        display:inline-block;
    }
    /* 姓名旁的印章 */
    .master-name::after{
        content:"刘产之印";
        position:absolute;
        right:-58px;bottom:-10px;
        width:46px;height:46px;
        border:3px solid var(--cinnabar);
        border-radius:6px;
        color:var(--cinnabar);
        font-family:"Ma Shan Zheng",cursive;
        font-size:15px;
        line-height:1.05;
        padding:3px;
        text-align:center;
        display:flex;align-items:center;justify-content:center;
        flex-wrap:wrap;
        transform:rotate(-4deg);
        opacity:.9;
    }
    .subtitle{
        margin-top:22px;
        font-size:15px;
        letter-spacing:8px;
        color:var(--ink-light);
        font-style:italic;
    }
    .divider{
        display:flex;align-items:center;justify-content:center;
        gap:14px;margin-top:26px;color:var(--gold);
        font-size:18px;
    }
    .divider::before,.divider::after{
        content:"";height:1px;width:90px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
    }

    /* ============ 简介 ============ */
    .intro{
        position:relative;z-index:2;
        max-width:680px;margin:40px auto 10px;
        padding:0 30px;
        text-align:center;
        font-size:16px;
        line-height:2.2;
        color:var(--ink-light);
        letter-spacing:1px;
    }
    .intro .quote{
        font-family:"Ma Shan Zheng",cursive;
        font-size:20px;color:var(--ink);letter-spacing:3px;
    }

    /* ============ 作品卷轴区 ============ */
    .gallery{
        position:relative;z-index:2;
        display:flex;flex-direction:row-reverse;
        justify-content:center;align-items:flex-start;
        gap:34px;
        padding:50px 6vw 80px;
        flex-wrap:wrap;
    }

    .piece{
        position:relative;
        background:linear-gradient(180deg,#fffdf6,#f7f1e3);
        padding:22px 18px 34px;
        box-shadow:
            0 2px 6px rgba(0,0,0,.12),
            0 18px 40px rgba(90,70,40,.20);
        transition:transform .5s ease,box-shadow .5s ease;
        border:1px solid rgba(160,140,105,.25);
    }
    .piece::before{
        content:"";position:absolute;inset:8px;
        border:1px solid rgba(168,134,77,.35);
        pointer-events:none;
    }
    .piece:hover{
        transform:translateY(-8px) rotate(0deg) !important;
        box-shadow:0 26px 60px rgba(90,70,40,.32);
    }

    .piece img{
        display:block;
        max-height:430px;width:auto;max-width:100%;
        filter:contrast(1.08) sepia(.10);
        mix-blend-mode:multiply;
    }

    .piece:nth-child(1){transform:rotate(1.2deg);}
    .piece:nth-child(2){transform:rotate(-0.8deg);}
    .piece:nth-child(3){transform:rotate(0.6deg);}
    .piece:nth-child(4){transform:rotate(-1.4deg);}
    .piece:nth-child(5){transform:rotate(0.9deg);}

    .piece .caption{
        margin-top:14px;
        text-align:center;
        font-family:"Ma Shan Zheng",cursive;
        font-size:19px;letter-spacing:4px;color:var(--ink);
    }
    .piece .caption small{
        display:block;margin-top:5px;
        font-family:"Noto Serif SC",serif;
        font-size:12px;letter-spacing:2px;color:var(--cinnabar);
    }

    /* ============ 印章落款区 ============ */
    .colophon{
        position:relative;z-index:2;
        text-align:center;
        padding:20px 20px 70px;
        color:var(--ink-light);
        font-size:14px;letter-spacing:3px;line-height:2.4;
        border-top:1px solid rgba(168,134,77,.4);
        margin:0 10vw;
    }
    .seal{
        display:inline-block;margin-top:16px;
        border:3px solid var(--cinnabar);
        border-radius:8px;
        padding:8px 12px;
        color:var(--cinnabar);
        font-family:"Ma Shan Zheng",cursive;
        font-size:17px;letter-spacing:2px;
        transform:rotate(-3deg);
        line-height:1.3;
    }

    @media (max-width:768px){
        .gallery{flex-direction:column-reverse;align-items:center;}
        .piece img{max-height:300px;}
        .master-name::after{right:-6px;bottom:-56px;width:38px;height:38px;font-size:12px;}
        header{margin:0 4vw;}
        .colophon{margin:0 4vw;}
    }
</style>
</head>
<body>

<header>
    <div class="studio-name">墨 韵 堂</div>
    <h1 class="master-name">刘产</h1>
    <div class="subtitle">刘欣悦 · 书法作品集</div>
    <div class="divider">&#10046;</div>
</header>

<section class="intro">
    <p class="quote">「书者，散也。欲书先散怀抱，任情恣性，然后书之。」</p>
    <p style="margin-top:16px;">
        此卷所集，皆刘欣悦所书。欣悦于翰墨一道用力颇勤，尤倾心于<span style="color:#8c2418;font-family:'Ma Shan Zheng',cursive;">毛体</span>草书，
        临池不辍，追摹其纵横捭阖之势、飞扬跌宕之姿。学书贵在神似，
        形貌之间容有未逮，然一笔一画皆见其志趣与心性，
        笔底波澜处，已得几分洒脱气象。
    </p>
</section>

<div class="gallery">
    <figure class="piece">
        <img src="https://a1.boltp.com/2026/09/30/6abbe73e28a7d.jpg" alt="书法作品">
        <figcaption class="caption">序<small>临毛体 · 狂草</small></figcaption>
    </figure>
    <figure class="piece">
        <img src="https://a1.boltp.com/2026/09/30/6abbe73e6358d.jpg" alt="书法作品">
        <figcaption class="caption">句<small>临毛体 · 草书</small></figcaption>
    </figure>
    <figure class="piece">
        <img src="https://a1.boltp.com/2026/09/30/6abbe73e44007.jpg" alt="书法作品">
        <figcaption class="caption">飞白<small>临毛体 · 写意</small></figcaption>
    </figure>
    <figure class="piece">
        <img src="https://a1.boltp.com/2026/09/30/6abbe73e0d182.jpg" alt="书法作品">
        <figcaption class="caption">乐<small>临毛体 · 草书</small></figcaption>
    </figure>
    <figure class="piece">
        <img src="https://a1.boltp.com/2026/09/30/6abbe73e3489e.jpg" alt="书法作品">
        <figcaption class="caption">秋<small>临毛体 · 草书</small></figcaption>
    </figure>
</div>

<footer class="colophon">
    刘欣悦 谨识
    <div>近年临写毛体草书若干帧 集为《刘产》一帙</div>
    <div class="seal">刘欣悦<br>之印</div>
</footer>

</body>
</html>
