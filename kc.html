<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💎 现金矿场</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f5f0eb 0%, #e8e2da 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .app {
            max-width: 460px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10), 0 8px 24px rgba(0, 0, 0, 0.06);
            padding: 32px 24px 40px;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .hidden { display: none !important; }

        h2 {
            font-size: 26px;
            font-weight: 600;
            color: #1e2b3c;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: -0.5px;
        }
        .sub {
            text-align: center;
            color: #7a8a9a;
            font-size: 14px;
            margin-top: -12px;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #3d4e5f;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        .input-group input {
            width: 100%;
            padding: 16px 18px;
            font-size: 16px;
            background: rgba(248, 246, 244, 0.8);
            border: 1.5px solid rgba(200, 192, 184, 0.4);
            border-radius: 18px;
            outline: none;
            transition: all 0.2s;
            color: #1e2b3c;
            backdrop-filter: blur(4px);
        }
        .input-group input:focus {
            border-color: #2d7a4b;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 4px rgba(45, 122, 75, 0.10);
        }
        .input-group input::placeholder {
            color: #b0a8a0;
        }

        .btn {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 60px;
            background: #1f4d36;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 6px 0 #0f2b1e;
            transform: translateY(0);
            text-align: center;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0f2b1e;
        }
        .btn:disabled {
            opacity: 0.5;
            transform: translateY(3px);
            box-shadow: 0 2px 0 #0f2b1e;
            pointer-events: none;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn:active::after {
            opacity: 1;
        }
        .btn-secondary {
            background: #6b7a8a;
            box-shadow: 0 6px 0 #4a5764;
        }
        .btn-danger {
            background: #b13e3e;
            box-shadow: 0 6px 0 #7a2a2a;
        }
        .btn-mine {
            background: linear-gradient(145deg, #d4a017, #b8860b);
            box-shadow: 0 6px 0 #8f6b0e;
        }
        .btn-mine:active {
            box-shadow: 0 2px 0 #8f6b0e;
        }

        .toggle-link {
            text-align: center;
            margin-top: 18px;
            color: #2d7a4b;
            font-weight: 500;
            cursor: pointer;
            font-size: 15px;
            transition: color 0.2s;
            padding: 6px;
        }
        .toggle-link:hover {
            color: #1f4d36;
            text-decoration: underline;
        }

        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            background: rgba(240, 238, 234, 0.7);
            color: #1e2b3c;
            text-align: center;
            word-break: break-word;
            min-height: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(200, 192, 184, 0.2);
            transition: all 0.3s;
        }
        .message.error {
            background: rgba(248, 220, 220, 0.8);
            color: #b13e3e;
            border-color: rgba(177, 62, 62, 0.2);
        }
        .message.success {
            background: rgba(220, 248, 230, 0.8);
            color: #1f4d36;
            border-color: rgba(45, 122, 75, 0.2);
        }

        .balance-card {
            background: linear-gradient(135deg, #1f4d36 0%, #2d7a4b 100%);
            border-radius: 32px;
            padding: 28px 24px;
            color: #fff;
            margin-bottom: 28px;
            box-shadow: 0 12px 32px rgba(45, 122, 75, 0.25);
            position: relative;
            overflow: hidden;
        }
        .balance-card::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
            pointer-events: none;
        }
        .balance-card .label {
            font-size: 14px;
            opacity: 0.8;
            letter-spacing: 1px;
            font-weight: 400;
        }
        .balance-card .amount {
            font-size: 52px;
            font-weight: 700;
            margin: 6px 0 4px;
            line-height: 1.1;
            text-shadow: 0 2px 8px rgba(0,0,0,0.10);
            transition: transform 0.2s;
        }
        .balance-card .username {
            font-size: 16px;
            opacity: 0.9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }
        .balance-card .username span:last-child {
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }

        .section-title {
            font-size: 17px;
            font-weight: 600;
            color: #1e2b3c;
            margin: 26px 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0,0,0,0.06);
        }

        .transfer-box {
            background: rgba(248, 246, 244, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(200, 192, 184, 0.2);
        }

        .history-list {
            max-height: 190px;
            overflow-y: auto;
            background: rgba(248, 246, 244, 0.4);
            border-radius: 20px;
            padding: 4px 0;
            border: 1px solid rgba(200, 192, 184, 0.15);
            backdrop-filter: blur(4px);
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 18px;
            border-bottom: 1px solid rgba(200, 192, 184, 0.2);
            font-size: 14px;
            color: #1e2b3c;
            align-items: center;
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .history-item .desc {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .history-item .desc .arrow {
            color: #8a9aa8;
            font-weight: 300;
        }
        .history-item .amount {
            font-weight: 600;
        }
        .history-item .amount.out {
            color: #b13e3e;
        }
        .history-item .amount.in {
            color: #1f4d36;
        }
        .history-empty {
            padding: 24px;
            text-align: center;
            color: #9aa8b8;
            font-size: 14px;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }
        .history-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: #c5bdb5;
            border-radius: 10px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(30, 43, 60, 0.9);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            z-index: 999;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            background: rgba(177, 62, 62, 0.9);
        }
        .toast.success {
            background: rgba(45, 122, 75, 0.9);
        }

        @media (max-width: 480px) {
            .app { padding: 24px 16px 32px; }
            .balance-card .amount { font-size: 42px; }
            .btn { padding: 16px; font-size: 17px; }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn .spinner {
            display: none;
        }
        .btn-loading .spinner {
            display: inline-block;
        }
        .btn-loading .btn-text {
            display: none;
        }

        .error-detail {
            background: #fce8e8;
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 8px;
            font-size: 13px;
            color: #b13e3e;
            word-break: break-all;
            border: 1px solid #f5c6c6;
            display: none;
        }
        .error-detail.show {
            display: block;
        }
        .notice {
            background: #fff3cd;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #856404;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <div class="app" id="app">

        <!-- 温馨提示 -->
        <div class="notice" id="noticeBar">
            ⚠️ 请确保通过 <strong>http://localhost</strong> 或 <strong>http://127.0.0.1</strong> 访问<br>
            （使用 VS Code 的 Live Server 打开），否则可能无法正常使用。
        </div>

        <!-- ========== 登录视图 ========== -->
        <div id="loginView">
            <h2>🔐 登录</h2>
            <p class="sub">进入你的数字矿场</p>
            <div class="input-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="输入用户名" autocomplete="username">
            </div>
            <div class="input-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="输入密码" autocomplete="current-password">
            </div>
            <button class="btn" id="loginBtn">
                <span class="btn-text">登 录</span>
                <span class="spinner"></span>
            </button>
            <div class="toggle-link" id="gotoRegister">还没有账号？去注册</div>
            <div id="loginMessage" class="message"></div>
            <div id="loginErrorDetail" class="error-detail"></div>
        </div>

        <!-- ========== 注册视图 ========== -->
        <div id="registerView" class="hidden">
            <h2>📝 注册</h2>
            <p class="sub">开启你的挖矿之旅</p>
            <div class="input-group">
                <label>用户名</label>
                <input type="text" id="regUsername" placeholder="设置用户名" autocomplete="off">
            </div>
            <div class="input-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="设置密码" autocomplete="new-password">
            </div>
            <button class="btn" id="registerBtn">
                <span class="btn-text">注 册</span>
                <span class="spinner"></span>
            </button>
            <div class="toggle-link" id="gotoLogin">已有账号？去登录</div>
            <div id="registerMessage" class="message"></div>
            <div id="registerErrorDetail" class="error-detail"></div>
        </div>

        <!-- ========== 主界面 ========== -->
        <div id="mainView" class="hidden">
            <div class="balance-card">
                <div class="label">💰 当前资产</div>
                <div class="amount" id="balanceAmount">0</div>
                <div class="username">
                    <span id="displayUsername">用户</span>
                    <span id="displayUid">UID: --</span>
                </div>
            </div>

            <div class="section-title">⛏️ 挖矿</div>
            <button class="btn btn-mine" id="mineBtn">
                <span class="btn-text">⛏️ 挖矿（冷却 60s）</span>
                <span class="spinner"></span>
            </button>
            <div id="mineMessage" class="message"></div>
            <div id="mineErrorDetail" class="error-detail"></div>

            <div class="section-title">💸 转账</div>
            <div class="transfer-box">
                <div class="input-group">
                    <label>收款人用户名</label>
                    <input type="text" id="transferTo" placeholder="输入收款人">
                </div>
                <div class="input-group">
                    <label>金额（分）</label>
                    <input type="number" id="transferAmount" placeholder="正整数" min="1" value="10">
                </div>
                <button class="btn" id="transferBtn">
                    <span class="btn-text">💸 塞现金 · 转账</span>
                    <span class="spinner"></span>
                </button>
                <div id="transferMessage" class="message"></div>
                <div id="transferErrorDetail" class="error-detail"></div>
            </div>

            <div class="section-title">📋 交易流水</div>
            <div class="history-list" id="historyList">
                <div class="history-empty">暂无交易记录</div>
            </div>

            <button class="btn btn-danger" id="logoutBtn" style="margin-top:24px;">
                <span class="btn-text">🚪 退出登录</span>
            </button>
        </div>
    </div>

    <script>
        // ================================================================
        //  🚀 配置区域（所有参数已固化）
        // ================================================================
        const FILE_ID = '555871487218';
        const SCRIPT_ID = 'V2-3eNCpvBvUk0SuMV76Gt70C';
        const TOKEN = '6yje16Ws26XvYqxONjw4AY';

        // 原始 WPS Webhook 地址
        const ORIGINAL_URL = `https://www.kdocs.cn/api/v3/ide/file/${FILE_ID}/script/${SCRIPT_ID}/sync_task`;

        // 使用 cors.lol 代理（稳定，支持 POST + 自定义头部）
        const WEBHOOK_URL = 'https://api.cors.lol/?url=' + encodeURIComponent(ORIGINAL_URL);

        // ================================================================
        //  调用代理（带详细错误捕获）
        // ================================================================
        async function callAirScript(functionName, params) {
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'AirScript-Token': TOKEN
                    },
                    body: JSON.stringify({
                        function: functionName,
                        params: params
                    })
                });

                if (!response.ok) {
                    // 尝试读取错误详情
                    let errText = await response.text();
                    throw new Error(`HTTP ${response.status} - ${errText || response.statusText}`);
                }

                const data = await response.json();
                // 兼容不同返回格式
                return data.result !== undefined ? data.result : data;
            } catch (err) {
                // 抛出详细错误，便于展示
                throw new Error(`请求失败: ${err.message}`);
            }
        }

        // ================================================================
        //  显示错误详情
        // ================================================================
        function showError(detailElement, message) {
            detailElement.textContent = message;
            detailElement.classList.add('show');
        }

        function clearError(detailElement) {
            detailElement.textContent = '';
            detailElement.classList.remove('show');
        }

        // ================================================================
        //  Toast 提示
        // ================================================================
        let toastTimer = null;
        function showToast(msg, type = '') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast' + (type ? ' ' + type : '');
            void el.offsetWidth;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                el.classList.remove('show');
            }, 2800);
        }

        // ================================================================
        //  DOM 引用
        // ================================================================
        const loginView = document.getElementById('loginView');
        const registerView = document.getElementById('registerView');
        const mainView = document.getElementById('mainView');

        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const loginMessage = document.getElementById('loginMessage');
        const loginErrorDetail = document.getElementById('loginErrorDetail');

        const regUsername = document.getElementById('regUsername');
        const regPassword = document.getElementById('regPassword');
        const registerBtn = document.getElementById('registerBtn');
        const registerMessage = document.getElementById('registerMessage');
        const registerErrorDetail = document.getElementById('registerErrorDetail');

        const balanceAmount = document.getElementById('balanceAmount');
        const displayUsername = document.getElementById('displayUsername');
        const displayUid = document.getElementById('displayUid');
        const transferTo = document.getElementById('transferTo');
        const transferAmount = document.getElementById('transferAmount');
        const transferBtn = document.getElementById('transferBtn');
        const transferMessage = document.getElementById('transferMessage');
        const transferErrorDetail = document.getElementById('transferErrorDetail');
        const historyList = document.getElementById('historyList');
        const logoutBtn = document.getElementById('logoutBtn');
        const mineBtn = document.getElementById('mineBtn');
        const mineMessage = document.getElementById('mineMessage');
        const mineErrorDetail = document.getElementById('mineErrorDetail');

        const gotoRegister = document.getElementById('gotoRegister');
        const gotoLogin = document.getElementById('gotoLogin');

        let currentUser = null;
        let transactionHistory = [];

        // ================================================================
        //  视图切换
        // ================================================================
        function showLoginView() {
            loginView.classList.remove('hidden');
            registerView.classList.add('hidden');
            mainView.classList.add('hidden');
            loginMessage.textContent = '';
            loginMessage.className = 'message';
            clearError(loginErrorDetail);
            loginBtn.disabled = false;
            loginBtn.querySelector('.btn-text').style.display = 'inline';
            loginBtn.querySelector('.spinner').style.display = 'none';
        }

        function showRegisterView() {
            loginView.classList.add('hidden');
            registerView.classList.remove('hidden');
            mainView.classList.add('hidden');
            registerMessage.textContent = '';
            registerMessage.className = 'message';
            clearError(registerErrorDetail);
            registerBtn.disabled = false;
            registerBtn.querySelector('.btn-text').style.display = 'inline';
            registerBtn.querySelector('.spinner').style.display = 'none';
        }

        function showMainView(userData) {
            loginView.classList.add('hidden');
            registerView.classList.add('hidden');
            mainView.classList.remove('hidden');
            balanceAmount.textContent = userData.balance;
            displayUsername.textContent = userData.username;
            displayUid.textContent = `UID: ${userData.uid}`;
            transferMessage.textContent = '';
            transferMessage.className = 'message';
            clearError(transferErrorDetail);
            mineMessage.textContent = '';
            mineMessage.className = 'message';
            clearError(mineErrorDetail);
            renderHistory();
            transferBtn.disabled = false;
            transferBtn.querySelector('.btn-text').style.display = 'inline';
            transferBtn.querySelector('.spinner').style.display = 'none';
            mineBtn.disabled = false;
            mineBtn.querySelector('.btn-text').style.display = 'inline';
            mineBtn.querySelector('.spinner').style.display = 'none';
        }

        // ================================================================
        //  渲染历史
        // ================================================================
        function renderHistory() {
            if (transactionHistory.length === 0) {
                historyList.innerHTML = `<div class="history-empty">暂无交易记录</div>`;
                return;
            }
            const items = transactionHistory.slice(-10).reverse();
            historyList.innerHTML = items.map(item => {
                const isOut = item.from === currentUser.username;
                const cls = isOut ? 'out' : 'in';
                const sign = isOut ? '-' : '+';
                return `
                    <div class="history-item">
                        <div class="desc">
                            <span>${item.from}</span>
                            <span class="arrow">→</span>
                            <span>${item.to}</span>
                        </div>
                        <div class="amount ${cls}">${sign}${item.amount}</div>
                    </div>
                `;
            }).join('');
        }

        // ================================================================
        //  设置按钮加载状态
        // ================================================================
        function setButtonLoading(btn, loading) {
            const text = btn.querySelector('.btn-text');
            const spinner = btn.querySelector('.spinner');
            if (loading) {
                text.style.display = 'none';
                spinner.style.display = 'inline-block';
                btn.disabled = true;
            } else {
                text.style.display = 'inline';
                spinner.style.display = 'none';
                btn.disabled = false;
            }
        }

        // ================================================================
        //  注册
        // ================================================================
        async function handleRegister() {
            const username = regUsername.value.trim();
            const password = regPassword.value;
            if (!username || !password) {
                registerMessage.textContent = '❌ 请填写完整';
                registerMessage.className = 'message error';
                return;
            }
            setButtonLoading(registerBtn, true);
            registerMessage.textContent = '⏳ 注册中...';
            registerMessage.className = 'message';
            clearError(registerErrorDetail);

            try {
                const result = await callAirScript('registerUser', { username, password });
                if (result.code === 200) {
                    registerMessage.textContent = '✅ 注册成功，请登录';
                    registerMessage.className = 'message success';
                    loginUsername.value = username;
                    loginPassword.value = '';
                    setTimeout(showLoginView, 1200);
                    showToast('🎉 注册成功！', 'success');
                } else {
                    registerMessage.textContent = '❌ ' + (result.msg || '注册失败');
                    registerMessage.className = 'message error';
                    if (result.msg) showError(registerErrorDetail, result.msg);
                }
            } catch (err) {
                registerMessage.textContent = '❌ 网络错误，详见下方详情';
                registerMessage.className = 'message error';
                showError(registerErrorDetail, err.message);
                showToast('网络错误，请检查控制台', 'error');
            } finally {
                setButtonLoading(registerBtn, false);
            }
        }

        // ================================================================
        //  登录
        // ================================================================
        async function handleLogin() {
            const username = loginUsername.value.trim();
            const password = loginPassword.value;
            if (!username || !password) {
                loginMessage.textContent = '❌ 请填写完整';
                loginMessage.className = 'message error';
                return;
            }
            setButtonLoading(loginBtn, true);
            loginMessage.textContent = '⏳ 登录中...';
            loginMessage.className = 'message';
            clearError(loginErrorDetail);

            try {
                const result = await callAirScript('loginUser', { username, password });
                if (result.code === 200) {
                    currentUser = result.data;
                    transactionHistory = [];
                    showMainView(currentUser);
                    showToast(`👋 欢迎回来，${currentUser.username}`, 'success');
                    loginMessage.textContent = '';
                } else {
                    loginMessage.textContent = '❌ ' + (result.msg || '登录失败');
                    loginMessage.className = 'message error';
                    if (result.msg) showError(loginErrorDetail, result.msg);
                }
            } catch (err) {
                loginMessage.textContent = '❌ 网络错误，详见下方详情';
                loginMessage.className = 'message error';
                showError(loginErrorDetail, err.message);
                showToast('网络错误，请检查控制台', 'error');
            } finally {
                setButtonLoading(loginBtn, false);
            }
        }

        // ================================================================
        //  转账
        // ================================================================
        async function handleTransfer() {
            if (!currentUser) { showToast('请先登录', 'error'); return; }
            const toUser = transferTo.value.trim();
            const amount = parseInt(transferAmount.value);
            if (!toUser) {
                transferMessage.textContent = '❌ 请输入收款人';
                transferMessage.className = 'message error';
                return;
            }
            if (toUser === currentUser.username) {
                transferMessage.textContent = '❌ 不能转给自己';
                transferMessage.className = 'message error';
                return;
            }
            if (isNaN(amount) || amount <= 0) {
                transferMessage.textContent = '❌ 请输入正整数金额';
                transferMessage.className = 'message error';
                return;
            }

            setButtonLoading(transferBtn, true);
            transferMessage.textContent = '⏳ 转账中...';
            transferMessage.className = 'message';
            clearError(transferErrorDetail);

            try {
                const result = await callAirScript('transferMoney', {
                    fromUser: currentUser.username,
                    toUser: toUser,
                    amount: amount
                });
                if (result.code === 200) {
                    currentUser.balance = result.data.newFromBalance;
                    balanceAmount.textContent = currentUser.balance;
                    transactionHistory.push({ from: currentUser.username, to: toUser, amount });
                    renderHistory();
                    transferMessage.textContent = '✅ ' + result.msg;
                    transferMessage.className = 'message success';
                    transferTo.value = '';
                    transferAmount.value = '10';
                    showToast(`转账成功！-${amount} 分`, 'success');
                } else {
                    transferMessage.textContent = '❌ ' + (result.msg || '转账失败');
                    transferMessage.className = 'message error';
                    if (result.msg) showError(transferErrorDetail, result.msg);
                }
            } catch (err) {
                transferMessage.textContent = '❌ 网络错误，详见下方详情';
                transferMessage.className = 'message error';
                showError(transferErrorDetail, err.message);
                showToast('网络错误', 'error');
            } finally {
                setButtonLoading(transferBtn, false);
            }
        }

        // ================================================================
        //  挖矿
        // ================================================================
        async function handleMine() {
            if (!currentUser) { showToast('请先登录', 'error'); return; }
            setButtonLoading(mineBtn, true);
            mineMessage.textContent = '⛏️ 正在挖矿...';
            mineMessage.className = 'message';
            clearError(mineErrorDetail);

            try {
                const result = await callAirScript('mine', { username: currentUser.username });
                if (result.code === 200) {
                    currentUser.balance = result.data.newBalance;
                    balanceAmount.textContent = currentUser.balance;
                    mineMessage.textContent = '✅ ' + result.msg;
                    mineMessage.className = 'message success';
                    showToast(`⛏️ +${result.data.reward} 分`, 'success');
                } else if (result.code === 429) {
                    mineMessage.textContent = '⏳ ' + result.msg;
                    mineMessage.className = 'message';
                } else {
                    mineMessage.textContent = '❌ ' + (result.msg || '挖矿失败');
                    mineMessage.className = 'message error';
                    if (result.msg) showError(mineErrorDetail, result.msg);
                }
            } catch (err) {
                mineMessage.textContent = '❌ 网络错误，详见下方详情';
                mineMessage.className = 'message error';
                showError(mineErrorDetail, err.message);
                showToast('网络错误', 'error');
            } finally {
                setButtonLoading(mineBtn, false);
            }
        }

        // ================================================================
        //  退出
        // ================================================================
        function handleLogout() {
            currentUser = null;
            transactionHistory = [];
            showLoginView();
            loginPassword.value = '';
            loginMessage.textContent = '已退出';
            loginMessage.className = 'message';
            showToast('已安全退出');
        }

        // ================================================================
        //  事件绑定
        // ================================================================
        registerBtn.addEventListener('click', handleRegister);
        loginBtn.addEventListener('click', handleLogin);
        transferBtn.addEventListener('click', handleTransfer);
        mineBtn.addEventListener('click', handleMine);
        logoutBtn.addEventListener('click', handleLogout);

        gotoRegister.addEventListener('click', () => {
            showRegisterView();
            registerMessage.textContent = '';
            registerMessage.className = 'message';
            clearError(registerErrorDetail);
        });
        gotoLogin.addEventListener('click', () => {
            showLoginView();
            loginMessage.textContent = '';
            loginMessage.className = 'message';
            clearError(loginErrorDetail);
        });

        loginPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
        regPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleRegister(); });
        transferAmount.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleTransfer(); });

        // ================================================================
        //  启动应用
        // ================================================================
        showLoginView();
        console.log('💎 现金矿场已启动（代理模式：cors.lol）');
        console.log('📡 代理地址:', WEBHOOK_URL);
        console.log('🔑 如果仍然报错，请查看页面下方的红色错误详情。');
    </script>

</body>
</html>
